name: Recover approved CDC dbt path in PROD

on:
  workflow_dispatch:
    inputs:
      source_version_id:
        description: Approved PROD CDC source version with retained RAW rows
        required: true
        type: string
        default: 6e0cb93f-ea95-4b3a-a358-b343321223b8

permissions:
  contents: read

concurrency:
  group: prod-cdc-dbt-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Promote the DEV-tested digest and run CDC dbt only once
    runs-on: ubuntu-latest
    environment: production
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DEV_APP_ID: b33dbae7-e243-4e27-b3ca-1018f5897f87
      PROD_APP_ID: ${{ vars.PROD_APP_ID }}
      SOURCE_VERSION_ID: ${{ inputs.source_version_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: "1.160.1"
      - name: Promote the DEV-tested digest and recover dbt without re-ingestion
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DEV_APP_ID"
          test -n "$PROD_APP_ID"
          [[ "$SOURCE_VERSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]

          baseline_spec="$(mktemp)"
          promoted_spec="$(mktemp)"
          recovery_spec="$(mktemp)"
          dev_spec="$(mktemp)"
          promoted_captured=false

          restore_promoted_baseline() {
            recovery_status=$?
            set +e
            if [ "$promoted_captured" = true ]; then
              # Specifications contain provider-encrypted secrets. Never print them.
              doctl apps update "$PROD_APP_ID" --spec "$promoted_spec" --wait \
                --format ID,ActiveDeployment.ID --no-header
              restore_status=$?
              if [ "$restore_status" -ne 0 ]; then
                echo "::error::The temporary recovery topology could not be removed. Stop and restore the promoted baseline before further production work."
                recovery_status=1
              fi
            fi
            rm -f "$baseline_spec" "$promoted_spec" "$recovery_spec" "$dev_spec"
            trap - EXIT
            exit "$recovery_status"
          }
          trap restore_promoted_baseline EXIT

          doctl apps spec get "$PROD_APP_ID" --format json > "$baseline_spec"
          doctl apps spec get "$DEV_APP_ID" --format json > "$dev_spec"
          test "$(jq -r '.name' "$baseline_spec")" = "oh-lyme-data-prod"
          test "$(jq '[.jobs[] | select(.name == "approved-source-ingestion")] | length' "$baseline_spec")" = "1"
          test "$(jq '[.jobs[] | select(.name == "cdc-dbt-recovery-once")] | length' "$baseline_spec")" = "0"
          test "$(jq -r '.jobs[] | select(.name == "approved-source-ingestion") | .run_command' "$baseline_spec")" = "uv run atlas-data pipeline run-production-schedule"
          test "$(jq -r '.name' "$dev_spec")" = "oh-lyme-data-dev"
          test "$(jq '[.jobs[] | select(.name == "catalog-ingestion")] | length' "$dev_spec")" = "1"
          dev_digest="$(jq -r '.jobs[] | select(.name == "catalog-ingestion") | .image.digest' "$dev_spec")"
          test -n "$dev_digest"
          test "$dev_digest" != "null"

          dev_verified=false
          while read -r deployment_id; do
            doctl apps spec get "$DEV_APP_ID" --deployment "$deployment_id" --format json > "$dev_spec"
            if jq -e --arg digest "$dev_digest" '[.jobs[] | .image.digest] | index($digest)' "$dev_spec" > /dev/null; then
              dev_verified=true
              break
            fi
          done < <(doctl apps list-deployments "$DEV_APP_ID" --format ID --no-header)
          test "$dev_verified" = true

          # Retain the DEV-tested digest after recovery; only temporary topology rolls back.
          jq --arg digest "$dev_digest" '
            .jobs |= map(
              del(.github, .dockerfile_path, .source_dir)
              | .image = {
                  registry_type: "DOCR",
                  registry: "oh-lyme-data",
                  repository: "pipeline",
                  digest: $digest
                }
            )
          ' "$baseline_spec" > "$promoted_spec"
          promoted_captured=true

          jq --arg source_version_id "$SOURCE_VERSION_ID" '
            (.jobs[] | select(.name == "approved-source-ingestion")) as $template
            | .jobs += [
                $template
                | .name = "cdc-dbt-recovery-once"
                | .kind = "PRE_DEPLOY"
                | .run_command = "uv run atlas-data pipeline run-production-cdc-dbt-recovery --source-version-id " + $source_version_id
                | del(.schedule)
              ]
          ' "$promoted_spec" > "$recovery_spec"

          # Provider success is the result for the temporary non-routable PRE_DEPLOY job.
          # The command verifies approval and RAW rows before dbt and never ingests.
          doctl apps update "$PROD_APP_ID" --spec "$recovery_spec" --wait \
            --format ID,ActiveDeployment.ID --no-header
          echo "CDC dbt recovery completed; restoring the promoted baseline topology."
