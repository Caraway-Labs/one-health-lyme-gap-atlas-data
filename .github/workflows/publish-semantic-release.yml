name: Build and publish governed semantic release

# Epic #252 / Stories #273-278.  This workflow is the only automated entry
# point for semantic-table build, publication, and rollback.  Production is a
# GitHub protected environment and still requires the exact release commit plus
# its environment approval.
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact data-repository commit that passed DEV quality and review
        required: true
        type: string
      environment_name:
        description: Target GitHub Environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production
      operation:
        description: Protected semantic-release operation
        required: true
        default: build
        type: choice
        options:
          - build
          - publish
          - rollback
          - inspect_january_climate
      manifest_path:
        description: Reviewed source-pinned manifest path for build
        required: false
        default: docs/contracts/semantic-release/governed-2026-09-15-manifest.json
        type: string
      prepare_january_climate:
        description: Reconstruct reviewed January DEV membership in this private build job
        required: false
        default: false
        type: boolean
      january_prod_delivery:
        description: Reviewed January-only PROD delivery; excludes all migration execution
        required: false
        default: false
        type: boolean
      release_id:
        description: Candidate release for publish or retained release for rollback
        required: false
        default: governed-2026-09-17-unknown-coverage
        type: string
      reason:
        description: Human-readable publication or rollback reason
        required: false
        type: string
      approver:
        description: Optional named approver recorded on publication
        required: false
        type: string
      confirm:
        description: Confirm publish or rollback after human review
        required: false
        default: false
        type: boolean
      bounded_delivery:
        description: Apply 60-second SQL and five-minute execution-step limits for the reviewed NLCD cohort
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: semantic-release-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  semantic-release:
    if: ${{ inputs.operation != 'inspect_january_climate' }}
    name: Protected semantic release operation
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    env:
      TOPX_ENV: ${{ inputs.environment_name == 'production' && 'prod' || 'dev' }}
      ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS: ${{ (inputs.bounded_delivery || inputs.january_prod_delivery) && '60' || '' }}
      ENABLE_PRODUCTION_EXECUTION: ${{ inputs.environment_name == 'production' && 'true' || '' }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ inputs.january_prod_delivery && 'OH_LYME_PROD_APPROVAL_XS_WH' || secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
      - name: Verify the checkout is the requested commit
        run: |
          set -euo pipefail
          requested_commit="$(printf '%s' '${{ inputs.release_commit }}' | tr '[:upper:]' '[:lower:]')"
          test "$(git rev-parse HEAD)" = "$requested_commit"
          git merge-base --is-ancestor "$requested_commit" origin/main
      - uses: astral-sh/setup-uv@v6
      - name: Install Snowflake CLI and project dependencies
        run: |
          python -m pip install snowflake-cli-labs==3.25.0
          uv sync --frozen --extra dev --extra pipeline
      - name: Run local release-contract checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          # The test suite deliberately proves that production execution is
          # fail-closed.  Run it outside the production execution environment;
          # the protected Snowflake actions below retain their production gate.
          env -u ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS TOPX_ENV=dev ENABLE_PRODUCTION_EXECUTION='' \
            SNOWFLAKE_DATABASE=ONE_HEALTH_LYME_GAP_ATLAS_DEV uv run pytest -q
          uv run dbt parse --project-dir dbt --profiles-dir dbt
      - name: Set reviewed January connection limits
        if: ${{ inputs.january_prod_delivery == true }}
        run: |
          echo 'MAX_CON_RETRY_ATTEMPTS=0' >> "$GITHUB_ENV"
          echo 'SNOWFLAKE_NETWORK_TIMEOUT_SECONDS=65' >> "$GITHUB_ENV"
          echo 'ATLAS_JANUARY_PROD_SESSION=true' >> "$GITHUB_ENV"
      - name: Validate protected operation inputs
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_ID: ${{ inputs.release_id }}
          CONFIRM: ${{ inputs.confirm }}
          REASON: ${{ inputs.reason }}
          PREPARE_JANUARY_CLIMATE: ${{ inputs.prepare_january_climate }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          JANUARY_PROD_DELIVERY: ${{ inputs.january_prod_delivery }}
        run: |
          set -euo pipefail
          [[ "${{ inputs.release_commit }}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$RELEASE_ID" =~ ^[a-z0-9][a-z0-9-]{2,80}$ ]]
          if [[ "$JANUARY_PROD_DELIVERY" == "true" ]]; then
            test "${{ inputs.environment_name }}" = production
            test "${{ inputs.bounded_delivery }}" = true
            test "$MANIFEST_PATH" = docs/contracts/climate/january-2025-prod-release-input.json
            if [[ "$OPERATION" == build ]]; then
              test "$PREPARE_JANUARY_CLIMATE" = true
              test "$RELEASE_ID" = governed-2026-10-15-january-climate-prod
            elif [[ "$OPERATION" == publish ]]; then
              test "$PREPARE_JANUARY_CLIMATE" = false
              test "$RELEASE_ID" = governed-2026-10-15-january-climate-prod
            else
              test "$OPERATION" = rollback
              test "$PREPARE_JANUARY_CLIMATE" = false
              test "$RELEASE_ID" = governed-2026-10-06-nlcd-demo-cohort
            fi
          elif [[ "$PREPARE_JANUARY_CLIMATE" == "true" ]]; then
            test "${{ inputs.environment_name }}" = dev
            test "$OPERATION" = build
            test "$MANIFEST_PATH" = docs/contracts/climate/january-2025-dev-release-input.json
            test "$RELEASE_ID" = governed-2026-10-09-january-climate-dev
          fi
          if [[ "$OPERATION" != "build" && "$CONFIRM" != "true" ]]; then
            echo "::error::Publish and rollback require confirm=true after human review."
            exit 1
          fi
          if [[ "$OPERATION" != "build" && -z "${REASON// }" ]]; then
            echo "::error::Publish and rollback require a reason."
            exit 1
          fi
          if [[ "$OPERATION" == "rollback" && "${{ inputs.environment_name }}" != "production" ]]; then
            echo "::error::Rollback is restricted to the protected production environment."
            exit 1
          fi
      - name: Configure and verify the protected Snowflake connection
        timeout-minutes: ${{ inputs.january_prod_delivery && 126 || inputs.bounded_delivery && 5 || 360 }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/oh-lyme-semantic-release-key.p8"
          config_file="$RUNNER_TEMP/snowflake-connections.toml"
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          cat > "$config_file" <<EOF
          [connections.oh_lyme_semantic]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          role = "$SNOWFLAKE_ROLE"
          warehouse = "$SNOWFLAKE_WAREHOUSE"
          database = "$SNOWFLAKE_DATABASE"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "$key_file"
          private_key_passphrase = "$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE"
          EOF
          if [[ "${{ inputs.january_prod_delivery }}" != true ]]; then
            snow --config-file "$config_file" sql -c oh_lyme_semantic \
              -q "SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_DATABASE(), CURRENT_WAREHOUSE()" --format JSON
          fi
          export SNOWFLAKE_AUTH_METHOD=key_pair
          export SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")"
          if [[ "${{ inputs.january_prod_delivery }}" == true ]]; then
            timeout --signal=INT --kill-after=15s 180s uv run python - <<'PY'
          from lyme_gap_atlas_data.climate_prod_manifest import require_schema
          from lyme_gap_atlas_data.sql_sessions import connect
          from lyme_gap_atlas_shared.settings import SnowflakeSettings
          with connect(SnowflakeSettings()) as connection, connection.cursor() as cursor:
              require_schema(cursor)
          PY
          else
            if [[ "$TOPX_ENV" == "dev" ]]; then
              uv run atlas-data pipeline reconcile-legacy-dev-migrations \
                --database "$SNOWFLAKE_DATABASE" --commit "${{ inputs.release_commit }}" --confirm
            else
              uv run atlas-data pipeline reconcile-legacy-prod-migrations \
                --database "$SNOWFLAKE_DATABASE" --commit "${{ inputs.release_commit }}" --confirm
            fi
            uv run atlas-data pipeline apply-migrations \
              --database "$SNOWFLAKE_DATABASE" --commit "${{ inputs.release_commit }}" --confirm
          fi
      - name: Build, publish, or rollback the semantic release and prove state
        timeout-minutes: ${{ inputs.january_prod_delivery && 126 || inputs.bounded_delivery && 5 || 360 }}
        env:
          OPERATION: ${{ inputs.operation }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          RELEASE_ID: ${{ inputs.release_id }}
          REASON: ${{ inputs.reason }}
          APPROVER: ${{ inputs.approver }}
          PREPARE_JANUARY_CLIMATE: ${{ inputs.prepare_january_climate }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/oh-lyme-semantic-release-key.p8"
          config_file="$RUNNER_TEMP/snowflake-connections.toml"
          january_manifest="$RUNNER_TEMP/january-climate-release-manifest.json"
          trap 'rm -f "$key_file" "$config_file" "$january_manifest"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          cat > "$config_file" <<EOF
          [connections.oh_lyme_semantic]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          role = "$SNOWFLAKE_ROLE"
          warehouse = "$SNOWFLAKE_WAREHOUSE"
          database = "$SNOWFLAKE_DATABASE"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "$key_file"
          private_key_passphrase = "$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE"
          EOF
          export SNOWFLAKE_AUTH_METHOD=key_pair
          export SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")"
          command_limit=()
          if [[ "${{ inputs.january_prod_delivery }}" == true ]]; then
            command_limit=(timeout --signal=INT --kill-after=15s 3600s)
          fi
          if [[ "$OPERATION" == "build" ]]; then
            test -f "$MANIFEST_PATH"
            if [[ "$PREPARE_JANUARY_CLIMATE" == "true" ]]; then
              umask 077
              "${command_limit[@]}" uv run python -m lyme_gap_atlas_data.climate_manifest_prep \
                --input "$MANIFEST_PATH" \
                --metadata docs/contracts/climate/january-2025-recorded-metadata-candidate.json \
                --output "$january_manifest"
              MANIFEST_PATH="$january_manifest"
            fi
            manifest_release_id="$(uv run python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["release_id"])' "$MANIFEST_PATH")"
            test "$manifest_release_id" = "$RELEASE_ID"
            "${command_limit[@]}" uv run atlas-data pipeline semantic-release-build --manifest "$MANIFEST_PATH"
          elif [[ "$OPERATION" == "publish" ]]; then
            publish_args=(--release-id "$RELEASE_ID" --reason "$REASON" --confirm)
            if [[ -n "$APPROVER" ]]; then
              publish_args+=(--approver "$APPROVER")
            fi
            "${command_limit[@]}" uv run atlas-data pipeline semantic-release-publish "${publish_args[@]}"
          else
            "${command_limit[@]}" uv run atlas-data pipeline semantic-release-rollback \
              --release-id "$RELEASE_ID" --reason "$REASON" --confirm
          fi
          sql_limits=''
          if [[ "${{ inputs.bounded_delivery }}" == "true" ]]; then
            sql_limits="ALTER SESSION SET STATEMENT_TIMEOUT_IN_SECONDS=60, STATEMENT_QUEUED_TIMEOUT_IN_SECONDS=10, ABORT_DETACHED_QUERY=TRUE, QUERY_TAG='DATA594_BOUNDED_COHORT_DELIVERY'; "
          fi
          snow --config-file "$config_file" sql -c oh_lyme_semantic \
            -q "${sql_limits}SELECT release_id,status,bundle_sha256,current_release_id,county_count,observation_count,missing_observation_lineage FROM PRESENTATION.SEMANTIC_RELEASE_STATUS_V WHERE release_id='$RELEASE_ID'" --format JSON
          if [[ "${{ inputs.operation }}" != "build" ]]; then
            snow --config-file "$config_file" sql -c oh_lyme_semantic \
              -q "${sql_limits}SELECT release_id, schema_version, methodology_version, bundle_sha256 FROM PRESENTATION.CURRENT_RELEASE_V" --format JSON
          fi
          if [[ "${{ inputs.january_prod_delivery }}" == true && "$OPERATION" == publish ]]; then
            timeout --signal=INT --kill-after=15s 180s uv run python -m lyme_gap_atlas_data.climate_prod_manifest --verify-published
          fi

  climate-inspection:
    if: ${{ inputs.operation == 'inspect_january_climate' }}
    name: Protected read-only January inspection
    environment: ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra pipeline
      - name: Fixed read-only inspection only
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ inputs.release_commit }}
          INSPECTION_ENVIRONMENT: ${{ inputs.environment_name }}
          PREPARE_JANUARY_CLIMATE: ${{ inputs.prepare_january_climate }}
          CONFIRM: ${{ inputs.confirm }}
          BOUNDED_DELIVERY: ${{ inputs.bounded_delivery }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ inputs.environment_name == 'production' && 'OH_LYME_PROD_APPROVAL_XS_WH' || 'OH_LYME_DEV_INGEST_XS_WH' }}
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          test "$(git rev-parse origin/main)" = "$REVIEWED_COMMIT"
          test "${{ inputs.january_prod_delivery }}" = false
          test "$PREPARE_JANUARY_CLIMATE" = false
          test "$CONFIRM" = false
          test "$BOUNDED_DELIVERY" = true
          passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
          test "$passed" -gt 0
          key_file="$RUNNER_TEMP/january-inspection.p8"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '\n%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          SNOWFLAKE_AUTH_METHOD=key_pair \
          SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
          MAX_CON_RETRY_ATTEMPTS=0 \
          timeout --signal=INT --kill-after=15s 180s uv run python scripts/inspect_january_climate.py
