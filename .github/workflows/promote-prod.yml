name: Promote governed pipeline to PROD

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: DEV-tested DOCR image digest to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Approve and promote immutable image
    runs-on: ubuntu-latest
    environment: production
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DEV_APP_ID: b33dbae7-e243-4e27-b3ca-1018f5897f87
      PROD_APP_ID: ${{ vars.PROD_APP_ID }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: "1.160.1"
      - name: Verify digest is currently deployed and approved in DEV
        run: |
          test -n "$IMAGE_DIGEST"
          dev_digest="$(doctl apps spec get "$DEV_APP_ID" --format json | jq -r '.jobs[0].image.digest')"
          test "$dev_digest" = "$IMAGE_DIGEST"
      - name: Verify PROD target has been explicitly provisioned
        run: |
          test -n "$PROD_APP_ID"
          doctl apps get "$PROD_APP_ID" --format ID,Spec.Name
      - name: Promote the immutable image and add bounded parallel registration without exposing secrets
        run: |
          prod_spec="$(mktemp)"
          next_spec="$(mktemp)"
          trap 'rm -f "$prod_spec" "$next_spec"' EXIT

          # Keep the rendered production specification out of workflow output:
          # it contains provider-encrypted secret values. Six registration jobs
          # are cloned from discovery so secrets remain opaque. They claim disjoint
          # artifact leases, but start each worker ten minutes apart to prevent
          # concurrent MERGE statements from saturating the X-Small Snowflake
          # warehouse. Each stays bounded to 32 artifacts and 4,000 datasets.
          doctl apps spec get "$PROD_APP_ID" --format json > "$prod_spec"
          test "$(jq -r '.name' "$prod_spec")" = "oh-lyme-data-prod"

          jq --arg image_digest "$IMAGE_DIGEST" '
            (.jobs[] | select(.name == "catalog-discovery")) as $registration_template
            | .jobs |= map(select(
                .name != "catalog-registration"
                and (.name | test("^catalog-registration-[0-9]+$") | not)
              ))
            | .jobs += [
                range(1; 7) as $worker
                | $registration_template
                | .name = ("catalog-registration-" + ($worker | tostring | if length == 1 then "0" + . else . end))
                | .kind = "SCHEDULED"
                | .schedule = {cron: (((($worker - 1) * 10) | tostring) + " * * * *"), time_zone: "America/Denver"}
                | .run_command = "/app/.venv/bin/atlas-data pipeline register-latest-discovery --max-artifacts 32 --max-datasets 4000"
              ]
            | if ([.jobs[] | select(.name == "catalog-discovery" or .name == "approved-source-ingestion" or (.name | test("^catalog-registration-0[1-6]$")))] | length) == 8 then .
              else error("required production jobs are missing") end
            | if ([.jobs[] | select(.name == "catalog-discovery" or .name == "approved-source-ingestion" or (.name | test("^catalog-registration-0[1-6]$"))) | select(.image.registry_type == "DOCR" and .image.repository == "pipeline")] | length) == 8 then .
              else error("required production jobs do not use the pipeline image") end
            | .jobs |= map(
                if .name == "catalog-discovery" or .name == "approved-source-ingestion" or (.name | test("^catalog-registration-0[1-6]$"))
                then .image.digest = $image_digest
                else .
                end
              )
          ' "$prod_spec" > "$next_spec"
          doctl apps update "$PROD_APP_ID" --spec "$next_spec" --wait
