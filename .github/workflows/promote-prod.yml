name: Promote governed pipeline to PROD

on:
  workflow_dispatch:
    inputs:
      intelligence_daily_validate_only:
        description: Validate credential-free daily image metadata only; requires daily-only selector, no app update
        required: false
        default: false
        type: boolean
      daily_credential_placement_approved:
        description: Separately approved reuse of existing component credential references in the new daily/preflight components; no new credentials or grants
        required: false
        default: false
        type: boolean
      intelligence_daily_only:
        description: Deploy only the reviewed daily CDC RSS job using existing component credentials; preserve all six current jobs
        required: false
        default: false
        type: boolean
      retained_human_lineage_only:
        description: Install only V161 scoped human-record identities and derived hashes; no model/scientific approval
        required: false
        type: boolean
        default: false
      retained_lineage_only:
        description: Install only authorized V160 restricted retained-lineage secure views; no image promotion or scientific admission
        required: false
        type: boolean
        default: false
      release_integrity_only:
        description: Install only reviewed V157/V158/V159 before exact DEV-tested image promotion; no approvals or publication
        required: false
        type: boolean
        default: false
      cdc_admission_only:
        description: Apply only reviewed V156 before promoting the exact DEV-tested image; no decision registration
        required: false
        type: boolean
        default: false
      january_climate_only:
        description: Apply only the reviewed PROD January V151/V152 pair; no image promotion
        required: false
        type: boolean
        default: false
      january_bulk_recovery_only:
        description: Apply only reviewed PROD V153 bulk-stage recovery; no image promotion
        required: false
        type: boolean
        default: false
      january_point_query_only:
        description: Apply only reviewed PROD V154 point-query view; no image promotion
        required: false
        type: boolean
        default: false
      county_context_only:
        description: Apply only reviewed V155 county context view; no image promotion
        required: false
        type: boolean
        default: false
      reviewed_commit:
        description: Exact reviewed green main for scoped migrations
        required: false
        type: string
      fixture_source_commit:
        description: Exact independently reviewed RI706 source SHA tested in isolated DEV
        required: false
        type: string
      fixture_validation_run_id:
        description: Successful protected RI706 fixture workflow run containing acceptance receipts
        required: false
        type: string
      image_digest:
        description: DEV-tested DOCR image digest to promote
        required: true
        type: string
      expected_pending_json:
        description: Exact reviewed PROD pending migration set; required for protected intelligence cleanup authority
        required: false
        type: string
      approve_intelligence_cleanup_only:
        description: Record only an independently approved exact PROD EID cleanup plan; no migration, deletion or deployment
        required: false
        default: false
        type: boolean
      cleanup_plan_sha256:
        description: Exact externally approved PROD EID raw-copy plan SHA256
        required: false
        type: string
      cleanup_source_id:
        description: One exact approved CDC source for the separately reviewed cleanup plan
        required: false
        default: cdc-eid-expedited
        type: choice
        options:
          - cdc-eid-expedited
          - cdc-eid-ahead-of-print
          - cdc-outbreaks
      cleanup_planned_at:
        description: Original canonical planned_at from the unchanged private dry-run plan
        required: false
        type: string
      cleanup_approval_ref:
        description: Independently approved review reference for this exact plan
        required: false
        type: string
      protected_intelligence_prerequisite:
        description: Apply only the exact reviewed intelligence migration set after V146; no image promotion
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: prod-app-topology
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.approve_intelligence_cleanup_only != true && inputs.retained_human_lineage_only != true && inputs.retained_lineage_only != true && (inputs.release_integrity_only == true || (inputs.january_climate_only != true && inputs.january_bulk_recovery_only != true && inputs.january_point_query_only != true && inputs.county_context_only != true)) ) }}
    name: Approve and promote immutable image
    runs-on: ubuntu-latest
    environment: production
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DEV_APP_ID: b33dbae7-e243-4e27-b3ca-1018f5897f87
      PROD_APP_ID: ${{ vars.PROD_APP_ID }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate expected_pending_json
        id: expected_pending
        env:
          EXPECTED_PENDING_JSON: ${{ inputs.expected_pending_json }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_PENDING_JSON}" ]; then
            printf 'normalized=\n' >> "$GITHUB_OUTPUT"
          else
            normalized="$(bash scripts/validate_expected_pending_json.sh)"
            printf 'normalized=%s\n' "$normalized" >> "$GITHUB_OUTPUT"
          fi
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: "1.160.1"
      - name: Verify digest is currently deployed and approved in DEV
        if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.release_integrity_only != true ) }}
        run: |
          source scripts/ci/guard.sh
          guard_nonempty image_digest "$IMAGE_DIGEST" "IMAGE_DIGEST is empty. Re-run with the digest from the latest successful deploy-dev run."
          dev_digest="$(doctl apps spec get "$DEV_APP_ID" --format json | jq -r '.jobs[0].image.digest')"
          guard_eq dev_image_digest "$IMAGE_DIGEST" "$dev_digest" "The DEV image digest does not match IMAGE_DIGEST. Re-run with the digest from the latest successful deploy-dev run."
          source_digest="$(doctl registry repository list-manifests pipeline --output json \
            | jq -r --arg tag "sha-${GITHUB_SHA}" '.[] | select(.tags | index($tag)) | .digest')"
          guard_eq registry_source_digest "$IMAGE_DIGEST" "$source_digest" "The registry manifest tagged sha-GITHUB_SHA does not match IMAGE_DIGEST. Re-run with the digest from the latest successful deploy-dev run for this commit."
      - name: Verify PROD target has been explicitly provisioned
        if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.release_integrity_only != true ) }}
        run: |
          source scripts/ci/guard.sh
          guard_nonempty prod_app_id "$PROD_APP_ID" "PROD_APP_ID is empty. Set the PROD_APP_ID repository variable to the provisioned production app before dispatching."
          doctl apps get "$PROD_APP_ID" --format ID,Spec.Name
      - uses: astral-sh/setup-uv@v6
      - name: Install Snowflake CLI for the protected PROD migration step
        run: python -m pip install snowflake-cli-labs==3.25.0
      - run: uv sync --frozen --extra dev --extra pipeline
      - name: Verify isolated DEV acceptance and identical reviewed source before pair-only installation
        if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.release_integrity_only == true ) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          FIXTURE_SOURCE_COMMIT: ${{ inputs.fixture_source_commit }}
          FIXTURE_VALIDATION_RUN_ID: ${{ inputs.fixture_validation_run_id }}
        run: |
          set -euo pipefail
          source scripts/ci/guard.sh
          uv run python scripts/verify_release_integrity_promotion.py
          source_digest="$(doctl registry repository list-manifests pipeline --output json | jq -r --arg tag "ri706-$FIXTURE_SOURCE_COMMIT" '[.[] | select((.tags // []) | index($tag)) | .digest] | if length == 1 then .[0] else empty end')"
          guard_eq release_integrity_source_digest "$IMAGE_DIGEST" "$source_digest" "The registry manifest tagged ri706-FIXTURE_SOURCE_COMMIT does not match IMAGE_DIGEST. Re-run with the digest recorded for that fixture source commit."
      - name: Apply checksum-validated PROD migrations before image promotion
        if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.cdc_admission_only != true && inputs.release_integrity_only != true ) }}
        env:
          TOPX_ENV: prod
          ENABLE_PRODUCTION_EXECUTION: "true"
          EXPECTED_PENDING_JSON: ${{ steps.expected_pending.outputs.normalized }}
          PROTECTED_INTELLIGENCE_PREREQUISITE: ${{ inputs.protected_intelligence_prerequisite }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ (inputs.january_climate_only || inputs.january_bulk_recovery_only || inputs.january_point_query_only || inputs.county_context_only) && 'OH_LYME_PROD_APPROVAL_XS_WH' || secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          source scripts/ci/guard.sh
          key_file="$RUNNER_TEMP/oh-lyme-prod-pipeline-key.p8"
          config_file="$RUNNER_TEMP/snowflake-connections.toml"
          trap 'rm -f "$key_file" "$config_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          cat > "$config_file" <<EOF
          [connections.oh_lyme_prod]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          role = "$SNOWFLAKE_ROLE"
          warehouse = "$SNOWFLAKE_WAREHOUSE"
          database = "$SNOWFLAKE_DATABASE"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "$key_file"
          private_key_passphrase = "$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE"
          EOF
          snow --config-file "$config_file" sql -c oh_lyme_prod \
            -q "SELECT CURRENT_ACCOUNT(), CURRENT_USER(), CURRENT_ROLE(), CURRENT_DATABASE(), CURRENT_WAREHOUSE()" --format JSON
          SNOWFLAKE_AUTH_METHOD=key_pair \
          SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE="$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" \
          uv run atlas-data pipeline migration-authority-preflight \
            --database "$SNOWFLAKE_DATABASE"
          if [ -n "$EXPECTED_PENDING_JSON" ]; then
            guard_true protected_intelligence_prerequisite "$PROTECTED_INTELLIGENCE_PREREQUISITE" "A reviewed pending set requires protected_intelligence_prerequisite=true. Redispatch with that flag, or omit expected_pending_json."
            # Reviewed allow-list. These exact strings stay; computing the set is out of scope.
            guard_one_of expected_pending_json "$EXPECTED_PENDING_JSON" "EXPECTED_PENDING_JSON is not one of the reviewed allow-list values. Redispatch with one exact allowed pending set." \
              '[{"version":"V150","filename":"V150__prod_intelligence_raw_cleanup_authority.sql","sha256":"883be2e32a84a461bcd20a46216b2a188a443c98ed8d913b443821208c99b4cb"}]' \
              '[{"version":"V162","filename":"V162__prod_intelligence_proactive_cleanup.sql","sha256":"451eda0f76fe21fda15058b59d1868804f7c32a49f87b21d77dd5f3b45c4b557"}]' \
              '[{"version":"V163","filename":"V163__prod_approved_metadata_feed_cleanup.sql","sha256":"1d4470c4eac4939bf4fbda4f56f0c8a1b004d6e9190d5512ae9e220e5b99b741"}]' \
              '[{"version":"V164","filename":"V164__prod_intelligence_daily_activation_view.sql","sha256":"670dd90048d479b69bc2d032537333da785f85698ba71b64c75aed39b20043c9"}]' \
              '[{"version":"V165","filename":"V165__prod_intelligence_daily_view_join_compatibility.sql","sha256":"1c5bdcdaaed21a0e5b44a57b224d536f623ee7c8ec15d35052224eb3c321b41d"}]' \
              '[{"version":"V166","filename":"V166__prod_nih_news_daily_activation_view.sql","sha256":"6ebe428121436db840a357506003d654df82a159f02737d9ab10c52d7f41500c"}]' \
              '[{"version":"V167","filename":"V167__prod_cdc_mmwr_daily_activation_view.sql","sha256":"cde1a5573525333f20bc847812bb3068493e81ec27b217b537dcf1a18d02c09f"}]' \
              '[{"version":"V168","filename":"V168__api_diagnostics_history_views.sql","sha256":"18fd6c1ec8b2b6bf483a2e76ce2be08074a31038d6131b7d2a23a8456676a3f6"}]' \
              '[{"version":"V169","filename":"V169__paper_policy_approval.sql","sha256":"1a70bbcf348f3f2daeaa6fde6522d86e26aee558235a5a6ca04a22023c4ea136"}]' \
              '[{"version":"V170","filename":"V170__intelligence_source_activations.sql","sha256":"bbead62278450bf4b9f72074b9bf928c46ea789c1e7225b5b933814ff814246f"}]' \
              '[{"version":"V171","filename":"V171__intelligence_item_topics.sql","sha256":"32ccb0f110f124e0b79c64aa66f75115bd74b106c04fb2ca580897ab1afd2079"}]' \
              '[{"version":"V150","filename":"V150__prod_intelligence_raw_cleanup_authority.sql","sha256":"883be2e32a84a461bcd20a46216b2a188a443c98ed8d913b443821208c99b4cb"},{"version":"V162","filename":"V162__prod_intelligence_proactive_cleanup.sql","sha256":"451eda0f76fe21fda15058b59d1868804f7c32a49f87b21d77dd5f3b45c4b557"}]'
            SNOWFLAKE_AUTH_METHOD=key_pair \
            SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
            SNOWFLAKE_PRIVATE_KEY_PASSPHRASE="$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" \
            uv run atlas-data pipeline apply-migrations \
              --database "$SNOWFLAKE_DATABASE" --commit "$GITHUB_SHA" \
              --expected-pending-json "$EXPECTED_PENDING_JSON" \
              --protected-intelligence-prerequisite --confirm
          else
            guard_ne protected_intelligence_prerequisite_absent true "$PROTECTED_INTELLIGENCE_PREREQUISITE" "protected_intelligence_prerequisite must not be true when expected_pending_json is empty. Redispatch with the flag false, or supply a reviewed pending set."
            SNOWFLAKE_AUTH_METHOD=key_pair \
            SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
            SNOWFLAKE_PRIVATE_KEY_PASSPHRASE="$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" \
            uv run atlas-data pipeline apply-migrations \
              --database "$SNOWFLAKE_DATABASE" --commit "$GITHUB_SHA" --confirm
          fi
      - name: Apply reviewed CDC authority without registering stewardship
        if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.cdc_admission_only == true && inputs.release_integrity_only != true ) }}
        env:
          TOPX_ENV: prod
          ENABLE_PRODUCTION_EXECUTION: "true"
          CDC_ADMISSION_ONLY: "true"
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          EXPECTED_PENDING_JSON: ${{ steps.expected_pending.outputs.normalized }}
          ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS: "60"
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          source scripts/ci/guard.sh
          guard_eq cdc_excludes_intelligence_prerequisite false '${{ inputs.protected_intelligence_prerequisite }}' "CDC admission cannot run with protected_intelligence_prerequisite=true. Redispatch with that flag false."
          key_file="$RUNNER_TEMP/cdc-prod-key.p8"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '\n%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          SNOWFLAKE_AUTH_METHOD=key_pair \
          SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
          MAX_CON_RETRY_ATTEMPTS=0 \
          timeout --signal=INT --kill-after=15s 300s uv run python scripts/apply_cdc_admission_migration.py
      - name: Apply only reviewed release integrity migrations
        if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.release_integrity_only == true ) }}
        env:
          TOPX_ENV: prod
          ENABLE_PRODUCTION_EXECUTION: "true"
          RELEASE_INTEGRITY_ONLY: "true"
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          EXPECTED_PENDING_JSON: ${{ steps.expected_pending.outputs.normalized }}
          ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS: "60"
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          source scripts/ci/guard.sh
          guard_eq release_integrity_excludes_intelligence_prerequisite false '${{ inputs.protected_intelligence_prerequisite }}' "Release-integrity promotion requires protected_intelligence_prerequisite=false. Redispatch with the other scoped flags false."
          guard_eq release_integrity_excludes_cdc_admission false '${{ inputs.cdc_admission_only }}' "Release-integrity promotion requires cdc_admission_only=false. Redispatch with the other scoped flags false."
          guard_eq release_integrity_excludes_county_context false '${{ inputs.county_context_only }}' "Release-integrity promotion requires county_context_only=false. Redispatch with the other scoped flags false."
          guard_eq release_integrity_excludes_january_climate false '${{ inputs.january_climate_only }}' "Release-integrity promotion requires january_climate_only=false. Redispatch with the other scoped flags false."
          guard_eq release_integrity_excludes_january_bulk_recovery false '${{ inputs.january_bulk_recovery_only }}' "Release-integrity promotion requires january_bulk_recovery_only=false. Redispatch with the other scoped flags false."
          guard_eq release_integrity_excludes_january_point_query false '${{ inputs.january_point_query_only }}' "Release-integrity promotion requires january_point_query_only=false. Redispatch with the other scoped flags false."
          key_file="$RUNNER_TEMP/integrity-prod-key.p8"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '\n%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          SNOWFLAKE_AUTH_METHOD=key_pair \
          SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
          MAX_CON_RETRY_ATTEMPTS=0 \
          timeout --signal=INT --kill-after=15s 300s uv run python scripts/apply_release_integrity_migrations.py
      - name: Promote the immutable image across the existing operational topology without exposing secrets
        if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.release_integrity_only != true && inputs.protected_intelligence_prerequisite != true ) }}
        run: |
          prod_spec="$(mktemp)"
          next_spec="$(mktemp)"
          trap 'rm -f "$prod_spec" "$next_spec"' EXIT

          # Keep the rendered production specification out of workflow output:
          # it contains provider-encrypted secret values. Rebuild the three bounded
          # registration jobs from discovery so their secrets remain opaque, then
          # require the exact already-provisioned six-job operational topology. A
          # promotion may update its image digest; it must not silently add, remove,
          # or accept temporary jobs.
          doctl apps spec get "$PROD_APP_ID" --format json > "$prod_spec"
          source scripts/ci/guard.sh
          prod_app_name="$(jq -r '.name' "$prod_spec")"
          guard_eq prod_app_name oh-lyme-data-prod "$prod_app_name" "The production app spec name is not oh-lyme-data-prod. Confirm PROD_APP_ID points at the governed production app."

          jq --arg image_digest "$IMAGE_DIGEST" '
            (.jobs[] | select(.name == "catalog-discovery")) as $registration_template
            | .jobs |= map(select(
                .name != "catalog-registration"
                and (.name | test("^catalog-registration-0[1-3]$") | not)
              ))
            | .jobs += [
                range(1; 4) as $worker
                | $registration_template
                | .name = ("catalog-registration-" + ($worker | tostring | if length == 1 then "0" + . else . end))
                | .kind = "SCHEDULED"
                | .schedule = {cron: ((($worker * 15) | tostring) + " * * * *"), time_zone: "America/Denver"}
                | .run_command = "/app/.venv/bin/atlas-data pipeline register-latest-discovery --max-artifacts 12 --max-datasets 1500"
              ]
            | if ([.jobs[].name] | sort) == ([
                "approved-source-ingestion",
                "catalog-discovery",
                "catalog-registration-01",
                "catalog-registration-02",
                "catalog-registration-03",
                "cdc-operations-watchdog"
              ] | sort) then .
              else error("production job topology differs from the approved six-job baseline") end
            | if ([.jobs[] | select(.kind == "SCHEDULED")] | length) == 6 then .
              else error("production jobs must all be scheduled") end
            | if ([.jobs[] | select(.image.registry_type == "DOCR" and .image.repository == "pipeline")] | length) == 6 then .
              else error("production jobs do not all use the pipeline image") end
            | .jobs |= map(
                .image.digest = $image_digest
                | .envs = ((.envs // [])
                    | map(select(.key != "SNOWFLAKE_ROLE"))
                    + [{key: "SNOWFLAKE_ROLE", scope: "RUN_AND_BUILD_TIME", value: "OH_LYME_PROD_RUNTIME"}])
              )
          ' "$prod_spec" > "$next_spec"
          doctl apps update "$PROD_APP_ID" --spec "$next_spec" --wait



  january-climate:
    if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.approve_intelligence_cleanup_only != true && inputs.retained_human_lineage_only != true && inputs.retained_lineage_only != true && inputs.release_integrity_only != true && inputs.cdc_admission_only != true && (inputs.january_climate_only == true || inputs.january_bulk_recovery_only == true || inputs.january_point_query_only == true || inputs.county_context_only == true) ) }}
    name: Protected reviewed PROD migrations only
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      checks: read
    env:
      TOPX_ENV: prod
      ENABLE_PRODUCTION_EXECUTION: "true"
      ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS: "60"
      COUNTY_CONTEXT_ONLY: ${{ inputs.county_context_only }}
      JANUARY_POINT_QUERY_ONLY: ${{ inputs.january_point_query_only }}
      JANUARY_BULK_RECOVERY_ONLY: ${{ inputs.january_bulk_recovery_only }}
      ATLAS_JANUARY_PROD_SESSION: "true"
      SNOWFLAKE_NETWORK_TIMEOUT_SECONDS: "65"
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ (inputs.january_climate_only || inputs.january_bulk_recovery_only || inputs.january_point_query_only || inputs.county_context_only) && 'OH_LYME_PROD_APPROVAL_XS_WH' || secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate expected_pending_json
        id: expected_pending
        env:
          EXPECTED_PENDING_JSON: ${{ inputs.expected_pending_json }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_PENDING_JSON}" ]; then
            printf 'normalized=\n' >> "$GITHUB_OUTPUT"
          else
            normalized="$(bash scripts/validate_expected_pending_json.sh)"
            printf 'normalized=%s\n' "$normalized" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra pipeline
      - name: Apply only reviewed scoped migrations
        env:
          EXPECTED_PENDING_JSON: ${{ steps.expected_pending.outputs.normalized }}
        run: |
          set -euo pipefail
          source scripts/ci/guard.sh
          guard_eq github_ref refs/heads/main "$GITHUB_REF" "Dispatch this workflow from main. Protected promotion does not run from another ref."
          guard_eq github_sha "$REVIEWED_COMMIT" "$GITHUB_SHA" "Dispatch from main at the reviewed commit, or update REVIEWED_COMMIT to the commit you reviewed."
          head_sha="$(git rev-parse HEAD)"
          guard_eq checked_out_commit "$REVIEWED_COMMIT" "$head_sha" "The checked-out commit does not match REVIEWED_COMMIT. Dispatch from main at the reviewed commit."
          if [[ "$COUNTY_CONTEXT_ONLY" == true ]]; then
            guard_eq county_context_image_digest county-context-only '${{ inputs.image_digest }}' "County-context promotion requires image_digest=county-context-only. Redispatch with that exact digest sentinel."
            guard_eq county_context_scopes false:false:false '${{ inputs.january_climate_only }}:${{ inputs.january_bulk_recovery_only }}:${{ inputs.january_point_query_only }}' "County-context promotion requires january_climate_only, january_bulk_recovery_only, and january_point_query_only to be false."
          else
            guard_eq january_image_digest january-climate-only '${{ inputs.image_digest }}' "This scoped migration requires image_digest=january-climate-only. Redispatch with that exact digest sentinel."
          fi
          guard_ne january_climate_and_bulk_recovery true:true '${{ inputs.january_climate_only }}:${{ inputs.january_bulk_recovery_only }}' "january_climate_only and january_bulk_recovery_only cannot both be true. Redispatch with only one of those scopes."
          if [[ '${{ inputs.january_point_query_only }}' == true ]]; then
            guard_eq january_point_query_scopes false:false '${{ inputs.january_climate_only }}:${{ inputs.january_bulk_recovery_only }}' "january_point_query_only requires january_climate_only and january_bulk_recovery_only to be false."
          fi
          guard_eq scoped_migration_excludes_intelligence_prerequisite false '${{ inputs.protected_intelligence_prerequisite }}' "Scoped January or county-context promotion requires protected_intelligence_prerequisite=false."
          passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
          guard_gt quality_checks 0 "$passed" "No successful Quality run was found for this commit. Wait for Quality to pass on main before dispatching."
          key_file="$RUNNER_TEMP/january-prod-migrations.p8"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '\n%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          runner=scripts/apply_january_prod_migrations.py
          if [[ "$COUNTY_CONTEXT_ONLY" == true ]]; then runner=scripts/apply_county_context_migration.py; fi
          deadline=1200s
          if [[ "$JANUARY_BULK_RECOVERY_ONLY" == true || "$JANUARY_POINT_QUERY_ONLY" == true || "$COUNTY_CONTEXT_ONLY" == true ]]; then deadline=180s; fi
          SNOWFLAKE_AUTH_METHOD=key_pair \
          SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
          MAX_CON_RETRY_ATTEMPTS=0 \
          timeout --signal=INT --kill-after=15s "$deadline" uv run python "$runner"

  retained-lineage:
    if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.approve_intelligence_cleanup_only != true && (inputs.retained_lineage_only == true || inputs.retained_human_lineage_only == true) ) }}
    name: Protected retained-lineage diagnostic installation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    permissions:
      contents: read
      checks: read
    env:
      TOPX_ENV: prod
      ENABLE_PRODUCTION_EXECUTION: "true"
      RETAINED_LINEAGE_ONLY: "true"
      RETAINED_LINEAGE_HUMAN_ONLY: ${{ inputs.retained_human_lineage_only }}
      DIAGNOSTIC_ARTIFACT: ${{ inputs.image_digest }}
      ATLAS_JANUARY_PROD_SESSION: "true"
      ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS: "60"
      SNOWFLAKE_NETWORK_TIMEOUT_SECONDS: "65"
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: OH_LYME_PROD_APPROVAL_XS_WH
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate expected_pending_json
        id: expected_pending
        env:
          EXPECTED_PENDING_JSON: ${{ inputs.expected_pending_json }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_PENDING_JSON}" ]; then
            printf 'normalized=\n' >> "$GITHUB_OUTPUT"
          else
            normalized="$(bash scripts/validate_expected_pending_json.sh)"
            printf 'normalized=%s\n' "$normalized" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact green main and exclusive diagnostic scope
        run: |
          set -euo pipefail
          source scripts/ci/guard.sh
          guard_eq github_ref refs/heads/main "$GITHUB_REF" "Dispatch this workflow from main. Protected promotion does not run from another ref."
          guard_eq github_sha "$REVIEWED_COMMIT" "$GITHUB_SHA" "Dispatch from main at the reviewed commit, or update REVIEWED_COMMIT to the commit you reviewed."
          head_sha="$(git rev-parse HEAD)"
          guard_eq checked_out_commit "$REVIEWED_COMMIT" "$head_sha" "The checked-out commit does not match REVIEWED_COMMIT. Dispatch from main at the reviewed commit."
          guard_eq retained_lineage_exclusive_scope false:false:false:false:false:false:false '${{ inputs.release_integrity_only }}:${{ inputs.cdc_admission_only }}:${{ inputs.january_climate_only }}:${{ inputs.january_bulk_recovery_only }}:${{ inputs.january_point_query_only }}:${{ inputs.county_context_only }}:${{ inputs.protected_intelligence_prerequisite }}' "Retained-lineage installation requires release_integrity_only, cdc_admission_only, january_climate_only, january_bulk_recovery_only, january_point_query_only, county_context_only, and protected_intelligence_prerequisite to be false."
          guard_ne retained_lineage_exclusive_flags true:true '${{ inputs.retained_lineage_only }}:${{ inputs.retained_human_lineage_only }}' "retained_lineage_only and retained_human_lineage_only cannot both be true. Choose one diagnostic scope."
          if [[ "$RETAINED_LINEAGE_HUMAN_ONLY" == true ]]; then
            guard_eq diagnostic_artifact retained-human-lineage-only "$DIAGNOSTIC_ARTIFACT" "Human retained-lineage requires image_digest=retained-human-lineage-only."
          else
            guard_eq diagnostic_artifact retained-lineage-only "$DIAGNOSTIC_ARTIFACT" "Retained-lineage requires image_digest=retained-lineage-only."
          fi
          passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
          guard_gt quality_checks 0 "$passed" "No successful Quality run was found for this commit. Wait for Quality to pass on main before dispatching."
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra pipeline
      - name: Install only exact authorized diagnostic migration and retain receipts
        env:
          EXPECTED_PENDING_JSON: ${{ steps.expected_pending.outputs.normalized }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/retained-lineage-migration.p8"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '\n%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          SNOWFLAKE_AUTH_METHOD=key_pair \
          SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
          MAX_CON_RETRY_ATTEMPTS=0 \
          timeout --signal=INT --kill-after=15s 300s uv run python scripts/apply_retained_lineage_migration.py
      - name: Preserve installation, DDL and grant receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-lineage-installation-${{ github.sha }}-${{ github.run_attempt }}
          path: retained-lineage-installation-receipt.json
          if-no-files-found: warn

  approve-intelligence-cleanup:
    if: ${{ inputs.intelligence_daily_validate_only != true && inputs.intelligence_daily_only != true && (inputs.approve_intelligence_cleanup_only == true ) }}
    name: Record approved EID raw cleanup plan only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate expected_pending_json
        id: expected_pending
        env:
          EXPECTED_PENDING_JSON: ${{ inputs.expected_pending_json }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_PENDING_JSON}" ]; then
            printf 'normalized=\n' >> "$GITHUB_OUTPUT"
          else
            normalized="$(bash scripts/validate_expected_pending_json.sh)"
            printf 'normalized=%s\n' "$normalized" >> "$GITHUB_OUTPUT"
          fi
      - name: Require exact green main and approval-only request
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_APPROVAL_INPUTS: ${{ toJSON(inputs) }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          source scripts/ci/guard.sh
          guard_eq github_ref refs/heads/main "$GITHUB_REF" "Dispatch this workflow from main. Protected promotion does not run from another ref."
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          guard_eq github_sha "$REVIEWED_COMMIT" "$GITHUB_SHA" "Dispatch from main at the reviewed commit, or update REVIEWED_COMMIT to the commit you reviewed."
          head_sha="$(git rev-parse HEAD)"
          guard_eq checked_out_commit "$REVIEWED_COMMIT" "$head_sha" "The checked-out commit does not match REVIEWED_COMMIT. Dispatch from main at the reviewed commit."
          passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
          guard_gt quality_checks 0 "$passed_checks" "No successful Quality run was found for this commit. Wait for Quality to pass on main before dispatching."
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra pipeline
      - name: Record only the exact reviewed EID plan using existing migration-service credentials
        env:
          CLEANUP_APPROVAL_INPUTS: ${{ toJSON(inputs) }}
          TOPX_ENV: prod
          ENABLE_PRODUCTION_EXECUTION: "true"
          ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS: "10"
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/intelligence-plan-approval-key.p8"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '\n%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          SNOWFLAKE_AUTH_METHOD=key_pair \
          SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
          MAX_CON_RETRY_ATTEMPTS=0 \
          uv run python -m scripts.approve_intelligence_raw_cleanup_prod

  intelligence-daily:
    if: ${{ inputs.approve_intelligence_cleanup_only != true && inputs.intelligence_daily_only == true }}
    name: ${{ inputs.intelligence_daily_validate_only && 'Validate only the daily image metadata' || 'Deploy only the approved daily intelligence job' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: "1.160.1"
      - name: Require isolated daily-only request and exact green reviewed main
        env:
          REQUEST: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          source scripts/ci/guard.sh
          guard_eq github_ref refs/heads/main "$GITHUB_REF" "Dispatch this workflow from main. Protected promotion does not run from another ref."
          guard_eq github_sha "$REVIEWED_COMMIT" "$GITHUB_SHA" "Dispatch from main at the reviewed commit, or update REVIEWED_COMMIT to the commit you reviewed."
          python - <<'PY'
          import json,os
          request=json.loads(os.environ['REQUEST'])
          assert not any(v is True or v=='true' for k,v in request.items()
                         if k not in {'intelligence_daily_only','intelligence_daily_validate_only'} and (k.endswith('_only') or k=='protected_intelligence_prerequisite'))
          validate=request.get('intelligence_daily_validate_only') in (True,'true')
          placement=request.get('daily_credential_placement_approved') in (True,'true')
          assert placement != validate
          PY
          quality_count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name=="checks" and .conclusion=="success")] | length')"
          guard_gt quality_checks 0 "$quality_count" "No successful Quality run was found for this commit. Wait for Quality to pass on main before dispatching."
      - name: Verify exact immutable digest is active in DEV
        if: inputs.intelligence_daily_validate_only != true
        run: |
          set -euo pipefail
          source scripts/ci/guard.sh
          dev_digest="$(doctl apps spec get b33dbae7-e243-4e27-b3ca-1018f5897f87 --format json | jq -r '.jobs[0].image.digest')"
          guard_eq dev_image_digest "$IMAGE_DIGEST" "$dev_digest" "The DEV image digest does not match IMAGE_DIGEST. Re-run with the digest from the latest successful deploy-dev run."
          source_digest="$(doctl registry repository list-manifests pipeline --output json | jq -r --arg tag "sha-${GITHUB_SHA}" '.[] | select(.tags | index($tag)) | .digest')"
          guard_eq registry_source_digest "$IMAGE_DIGEST" "$source_digest" "The registry manifest tagged sha-GITHUB_SHA does not match IMAGE_DIGEST. Re-run with the digest from the latest successful deploy-dev run for this commit."
      - name: Detect whether the daily job is already active in PROD
        if: inputs.intelligence_daily_validate_only != true
        id: intelligence_daily_prod_state
        run: |
          set -euo pipefail
          if doctl apps spec get 5d8966ed-d152-4a78-bdd6-14553dbc1483 --format json \
            | jq -e '.jobs[] | select(.name == "intelligence-feed-daily")' >/dev/null; then
            echo active=true >> "$GITHUB_OUTPUT"
          else
            echo active=false >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh only the immutable digest across all operational PROD jobs
        if: inputs.intelligence_daily_validate_only != true && steps.intelligence_daily_prod_state.outputs.active == 'true'
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/deploy_intelligence_daily.py --image-digest "$IMAGE_DIGEST" --phase refresh-digest --credential-placement-approved
      - name: Deploy explicitly approved credential-scoped preflight (no source acquisition)
        if: inputs.intelligence_daily_validate_only != true && steps.intelligence_daily_prod_state.outputs.active != 'true'
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/deploy_intelligence_daily.py --image-digest "$IMAGE_DIGEST" --phase preflight --credential-placement-approved
      - name: Enable only the daily job after successful service preflight
        if: inputs.intelligence_daily_validate_only != true && steps.intelligence_daily_prod_state.outputs.active != 'true'
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/deploy_intelligence_daily.py --image-digest "$IMAGE_DIGEST" --phase activate --credential-placement-approved
      - name: Validate credential-free image metadata only (no app update)
        if: inputs.intelligence_daily_validate_only == true
        run: python scripts/validate_intelligence_daily_prod.py --image-digest "$IMAGE_DIGEST"
