name: Promote governed pipeline to PROD

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: DEV-tested DOCR image digest to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Approve and promote immutable image
    runs-on: ubuntu-latest
    environment: production
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DEV_APP_ID: b33dbae7-e243-4e27-b3ca-1018f5897f87
      PROD_APP_ID: ${{ vars.PROD_APP_ID }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: "1.160.1"
      - name: Verify digest is currently deployed and approved in DEV
        run: |
          test -n "$IMAGE_DIGEST"
          dev_digest="$(doctl apps spec get "$DEV_APP_ID" --format json | jq -r '.jobs[0].image.digest')"
          test "$dev_digest" = "$IMAGE_DIGEST"
      - name: Verify PROD target has been explicitly provisioned
        run: |
          test -n "$PROD_APP_ID"
          doctl apps get "$PROD_APP_ID" --format ID,Spec.Name
      - name: Promote the immutable image and add registration without exposing secrets
        run: |
          prod_spec="$(mktemp)"
          next_spec="$(mktemp)"
          trap 'rm -f "$prod_spec" "$next_spec"' EXIT

          # Keep the rendered production specification out of workflow output:
          # it contains provider-encrypted secret values. The registration job
          # is cloned from discovery so existing encrypted runtime secrets stay
          # opaque; only its name, schedule, command, and image digest may change.
          doctl apps spec get "$PROD_APP_ID" --format json > "$prod_spec"
          test "$(jq -r '.name' "$prod_spec")" = "oh-lyme-data-prod"

          jq --arg image_digest "$IMAGE_DIGEST" '
            if any(.jobs[]; .name == "catalog-registration") then .
            else .jobs += [
              (.jobs[] | select(.name == "catalog-discovery")
                | .name = "catalog-registration"
                | .kind = "SCHEDULED"
                | .schedule = {cron: "*/5 * * * *", time_zone: "America/Denver"}
                | .run_command = "uv run atlas-data pipeline register-latest-discovery")
            ] end
            | if ([.jobs[] | select(.name == "catalog-discovery" or .name == "approved-source-ingestion" or .name == "catalog-registration")] | length) == 3 then .
              else error("required production jobs are missing") end
            | if ([.jobs[] | select(.name == "catalog-discovery" or .name == "approved-source-ingestion" or .name == "catalog-registration") | select(.image.registry_type == "DOCR" and .image.repository == "pipeline")] | length) == 3 then .
              else error("required production jobs do not use the pipeline image") end
            |
            .jobs |= map(
              if .name == "catalog-registration"
              then .image.digest = $image_digest
                | .kind = "SCHEDULED"
                | .schedule = {cron: "*/5 * * * *", time_zone: "America/Denver"}
                | .run_command = "/app/.venv/bin/atlas-data pipeline register-latest-discovery"
              elif .name == "catalog-discovery" or .name == "approved-source-ingestion"
              then .image.digest = $image_digest
              else .
              end
            )
          ' "$prod_spec" > "$next_spec"
          doctl apps update "$PROD_APP_ID" --spec "$next_spec" --wait
