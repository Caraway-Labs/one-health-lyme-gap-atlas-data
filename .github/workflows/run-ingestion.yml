name: Run governed ingestion (generic)

# Epic #259 / Stories #254-255 — one Actions surface for source run/resume.
# Workflow YAML must not encode source business logic.

on:
  workflow_dispatch:
    inputs:
      source_definition:
        description: SourceDefinition path, generated month, or nClimGrid month range
        required: true
        default: config/sources/cdc_x5j9_wybp.yml
        type: string
      environment_name:
        description: GitHub Environment (dev or production)
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production
      operation:
        description: Orchestrator operation
        required: true
        default: run
        type: choice
        options:
          - run
          - nclimgrid-batch
          - resume
          - validate
          - inspect
          - nclimgrid-pilot-measurement
          - bulk-transport-canary
          - january-source-registration
          - spaces-readiness
      intelligence_acquisition_only:
        description: Stop approved DEV feed run after ACQUIRE; intentional stop, no normalization/load/publish
        required: false
        type: boolean
        default: false
      candidate_keys_json:
        description: At most 16 exact existing DEV object keys for metadata HEAD, JSON array
        required: false
        default: '[]'
        type: string
      reviewed_commit:
        description: Exact reviewed main SHA for bounded January registration or frozen membership
        required: false
        type: string
      diagnostic_budget_evidence:
        description: Official pricing forecast and optional redacted Standard-edition evidence JSON; no private identifiers or credentials
        required: false
        type: string
      registration_phase:
        description: Factual January bindings only; never approve or publish
        required: false
        default: inspect
        type: choice
        options:
          - inspect
          - register-pending
      tier:
        description: Risk tier (A local/fixture via job, B DEV, C PROD protected)
        required: true
        default: B
        type: choice
        options:
          - A
          - B
          - C
      run_id:
        description: Existing run id for resume/inspect
        required: false
        type: string
      measurement_action:
        description: Read-only January 2025 pilot measurement
        required: false
        default: preflight
        type: choice
        options:
          - preflight
          - inspect
          - ordered-read
          - report
          - benchmark-history
          - candidate
          - candidate-diagnostic
          - frozen-membership
      recapture:
        description: Explicitly create new captures for completed batch definitions
        required: false
        default: false
        type: boolean
      publish:
        description: Request publish/stage (still subject to Tier C protections)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: read

concurrency:
  group: run-ingestion-${{ inputs.environment_name }}-${{ inputs.source_definition }}
  cancel-in-progress: false

jobs:
  spaces_readiness:
    if: inputs.operation == 'spaces-readiness' && !inputs.intelligence_acquisition_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    env:
      TOPX_ENV: dev
      SPACES_REGION: ${{ secrets.SPACES_REGION }}
      SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
      SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
      SPACES_PREFIX: ${{ secrets.SPACES_PREFIX }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      SPACES_CANDIDATE_KEYS_JSON: ${{ inputs.candidate_keys_json }}
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed green main and DEV-only request
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment_name }}
          REQUESTED_TIER: ${{ inputs.tier }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          REQUESTED_RECAPTURE: ${{ inputs.recapture }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_ENVIRONMENT" = dev
          test "$REQUESTED_TIER" = B
          test "$REQUESTED_PUBLISH" = false
          test "$REQUESTED_RECAPTURE" = false
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
          test "$passed_checks" -gt 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Read bounded Spaces metadata only
        run: uv run python -m lyme_gap_atlas_data.spaces_readiness
  ingest:
    if: inputs.operation != 'spaces-readiness' || inputs.intelligence_acquisition_only
    name: Canonical ingestion entry point
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.intelligence_acquisition_only && 6 || inputs.operation == 'nclimgrid-pilot-measurement' && inputs.measurement_action == 'frozen-membership' && 5 || inputs.operation == 'january-source-registration' && 15 || startsWith(inputs.source_definition, 'config/sources/intelligence_') && 6 || 360 }}
    environment: ${{ inputs.intelligence_acquisition_only && 'dev' || inputs.operation == 'nclimgrid-pilot-measurement' && 'dev' || inputs.operation == 'bulk-transport-canary' && 'dev' || inputs.operation == 'january-source-registration' && 'dev' || inputs.environment_name }}
    env:
      TOPX_ENV: dev
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      # Runtime ingestion must not reuse the migration identity. The dev
      # environment keeps the migration secrets for deploy-dev.yml and stores
      # this worker identity under the explicit runtime names below.
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_RUNTIME_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_RUNTIME_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_AUTH_METHOD: key_pair
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_RUNTIME_PRIVATE_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_RUNTIME_PRIVATE_KEY_PASSPHRASE }}
      SPACES_REGION: ${{ inputs.operation != 'nclimgrid-pilot-measurement' && inputs.operation != 'january-source-registration' && secrets.SPACES_REGION || '' }}
      SPACES_ENDPOINT: ${{ inputs.operation != 'nclimgrid-pilot-measurement' && inputs.operation != 'january-source-registration' && secrets.SPACES_ENDPOINT || '' }}
      SPACES_BUCKET: ${{ inputs.operation != 'nclimgrid-pilot-measurement' && inputs.operation != 'january-source-registration' && secrets.SPACES_BUCKET || '' }}
      SPACES_PREFIX: ${{ inputs.operation != 'nclimgrid-pilot-measurement' && inputs.operation != 'january-source-registration' && secrets.SPACES_PREFIX || '' }}
      SPACES_ACCESS_KEY_ID: ${{ inputs.operation != 'nclimgrid-pilot-measurement' && inputs.operation != 'january-source-registration' && secrets.SPACES_ACCESS_KEY_ID || '' }}
      SPACES_SECRET_ACCESS_KEY: ${{ inputs.operation != 'nclimgrid-pilot-measurement' && inputs.operation != 'january-source-registration' && secrets.SPACES_SECRET_ACCESS_KEY || '' }}
    steps:
      - name: Start bounded January diagnostic clock
        if: inputs.operation == 'nclimgrid-pilot-measurement' && inputs.measurement_action == 'frozen-membership'
        run: echo "JANUARY_DIAGNOSTIC_JOB_STARTED_UNIX=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Verify reviewed main for January registration
        if: inputs.operation == 'january-source-registration' || (inputs.operation == 'nclimgrid-pilot-measurement' && inputs.measurement_action == 'frozen-membership')
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          PHASE: ${{ inputs.operation == 'january-source-registration' && inputs.registration_phase || 'inspect' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          case "$PHASE" in inspect|register-pending) ;; *) exit 1 ;; esac
          passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs" \
            --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
          test "$passed_checks" -gt 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install package
        run: uv sync --extra dev
      - name: Validate definition
        if: inputs.operation == 'validate' || inputs.operation == 'run'
        env:
          SOURCE_DEFINITION: ${{ inputs.source_definition }}
        run: uv run atlas-data source validate --definition "$SOURCE_DEFINITION"
      - name: Enforce environment and tier boundary
        if: inputs.intelligence_acquisition_only || inputs.operation == 'run' || inputs.operation == 'nclimgrid-batch' || inputs.operation == 'resume' || inputs.operation == 'nclimgrid-pilot-measurement' || inputs.operation == 'bulk-transport-canary' || inputs.operation == 'january-source-registration'
        env:
          SOURCE_DEFINITION: ${{ inputs.source_definition }}
          MEASUREMENT_RUN_ID: ${{ inputs.run_id }}
          INTELLIGENCE_ACQUISITION_ONLY: ${{ inputs.intelligence_acquisition_only }}
        run: |
          if [ "${INTELLIGENCE_ACQUISITION_ONLY:-false}" = "true" ]; then
            test "${{ inputs.operation }}" = "run"
            test "${{ inputs.environment_name }}" = "dev"
            test "${{ inputs.tier }}" = "B"
            test -z "$MEASUREMENT_RUN_ID"
            test "${{ inputs.recapture }}" = "false"
            test "${{ inputs.publish }}" = "false"
            case "$SOURCE_DEFINITION" in
              config/sources/intelligence_cdc_vital_signs.yml|config/sources/intelligence_nih_news_releases.yml) ;;
              *) echo 'Acquisition-only requires an approved DEV feed definition' >&2; exit 2 ;;
            esac
          fi
          if [ "${{ inputs.tier }}" = "B" ] && [ "${{ inputs.environment_name }}" != "dev" ]; then
            echo "::error::Tier B runs are limited to the dev GitHub Environment."
            exit 1
          fi
          if [ "${{ inputs.tier }}" = "C" ]; then
            echo "::error::Tier C execution belongs to the protected promote/publication workflows."
            exit 1
          fi
          if [ "${{ inputs.operation }}" = "nclimgrid-pilot-measurement" ]; then
            test "${{ inputs.environment_name }}" = "dev"
            test "${{ inputs.tier }}" = "B"
            test "$SOURCE_DEFINITION" = "config/sources/noaa_nclimgrid_daily_202501.yml"
            test "${{ inputs.recapture }}" = "false"
            test "${{ inputs.publish }}" = "false"
            if [ "${{ inputs.measurement_action }}" = "preflight" ]; then
              test -z "$MEASUREMENT_RUN_ID"
            else
              test -n "$MEASUREMENT_RUN_ID"
            fi
            if [ "${{ inputs.measurement_action }}" = "candidate" ] || [ "${{ inputs.measurement_action }}" = "candidate-diagnostic" ] || [ "${{ inputs.measurement_action }}" = "frozen-membership" ]; then
              test "$MEASUREMENT_RUN_ID" = "c2eb2146-005d-44d2-bac4-e2805ca42577"
            fi
          fi
          if [ "${{ inputs.operation }}" = "bulk-transport-canary" ]; then
            test "${{ inputs.environment_name }}" = "dev"
            test "${{ inputs.tier }}" = "B"
            test "${{ inputs.recapture }}" = "false"
            test "${{ inputs.publish }}" = "false"
            test -z "$MEASUREMENT_RUN_ID"
          fi
          if [ "${{ inputs.operation }}" = "january-source-registration" ]; then
            test "${{ inputs.environment_name }}" = "dev"
            test "${{ inputs.tier }}" = "B"
            test "$SOURCE_DEFINITION" = "config/sources/noaa_nclimgrid_daily_202501.yml"
            test "$MEASUREMENT_RUN_ID" = "c2eb2146-005d-44d2-bac4-e2805ca42577"
            test "${{ inputs.recapture }}" = "false"
            test "${{ inputs.publish }}" = "false"
          fi
      - name: Execute orchestrator operation with ephemeral Snowflake key
        if: inputs.operation == 'run' || inputs.operation == 'nclimgrid-batch' || inputs.operation == 'resume' || inputs.operation == 'nclimgrid-pilot-measurement' || inputs.operation == 'bulk-transport-canary' || inputs.operation == 'january-source-registration'
        env:
          SOURCE_DEFINITION: ${{ inputs.source_definition }}
          INGESTION_RUN_ID: ${{ inputs.run_id }}
          INTELLIGENCE_ACQUISITION_ONLY: ${{ inputs.intelligence_acquisition_only }}
          MEASUREMENT_ACTION: ${{ inputs.measurement_action }}
          JANUARY_DIAGNOSTIC_BUDGET_EVIDENCE: ${{ inputs.diagnostic_budget_evidence }}
          REGISTRATION_PHASE: ${{ inputs.registration_phase }}
        run: |
          set -euo pipefail
          for required_var in \
            SNOWFLAKE_USER \
            SNOWFLAKE_ROLE \
            SNOWFLAKE_PRIVATE_KEY_B64 \
            SNOWFLAKE_PRIVATE_KEY_PASSPHRASE
          do
            if [ -z "${!required_var:-}" ]; then
              echo "::error::Missing required generic-ingestion configuration: $required_var"
              exit 1
            fi
          done
          if [ "${{ inputs.operation }}" != "nclimgrid-pilot-measurement" ] && [ "${{ inputs.operation }}" != "bulk-transport-canary" ] && [ "${{ inputs.operation }}" != "january-source-registration" ]; then
            for required_var in \
              SPACES_ENDPOINT \
              SPACES_BUCKET \
              SPACES_ACCESS_KEY_ID \
              SPACES_SECRET_ACCESS_KEY
            do
              if [ -z "${!required_var:-}" ]; then
                echo "::error::Missing required generic-ingestion configuration: $required_var"
                exit 1
              fi
            done
          fi
          key_file="$RUNNER_TEMP/oh-lyme-ingestion-key.p8"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"

          # The secret stores the PEM body. The shared connector expects the
          # base64 encoding of the complete PEM file, so normalize it only in
          # this ephemeral process environment and never print the key.
          export SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")"

          # The bounded exporter verifies identity in its single session.
          if [ "${INTELLIGENCE_ACQUISITION_ONLY:-false}" != "true" ] && { [ "$MEASUREMENT_ACTION" != "frozen-membership" ] || [ "${{ inputs.operation }}" != "nclimgrid-pilot-measurement" ]; }; then
          uv run python - <<'PY'
          import os

          from lyme_gap_atlas_shared.settings import SnowflakeSettings
          from lyme_gap_atlas_shared.snowflake import connect

          # Per-environment runtime role names (ADR 0030 / Epic #294). DEV was
          # renamed by Story #297; PROD by this Story #298 change.
          runtime_role_by_environment = {
              "DEV": "OH_LYME_DEV_RUNTIME",
              "PROD": "OH_LYME_PROD_RUNTIME",
          }
          environment = os.environ["TOPX_ENV"].upper()
          expected_user = f"OH_LYME_{environment}_PIPELINE_SVC"
          expected_role = runtime_role_by_environment[environment]
          settings = SnowflakeSettings()
          with connect(settings) as connection, connection.cursor() as cursor:
              cursor.execute(
                  "SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_DATABASE(), "
                  "CURRENT_WAREHOUSE()"
              )
              user, role, database, warehouse = cursor.fetchone()
          print(
              "Snowflake runtime identity: "
              f"user={user}, role={role}, database={database}, warehouse={warehouse}"
          )
          if (user, role, database, warehouse) != (
              expected_user,
              expected_role,
              settings.snowflake_database,
              settings.snowflake_warehouse,
          ):
              raise SystemExit(
                  "Runtime ingestion requires the dedicated "
                  f"{expected_user}/{expected_role} identity."
              )
          PY
          fi
          if [ "${{ inputs.operation }}" = "bulk-transport-canary" ]; then
            uv run python scripts/nclimgrid_bulk_transport_canary.py
          elif [ "${{ inputs.operation }}" = "nclimgrid-pilot-measurement" ]; then
            if [ -n "$INGESTION_RUN_ID" ]; then
              uv run atlas-data source nclimgrid-pilot-measure --action "$MEASUREMENT_ACTION" --run-id "$INGESTION_RUN_ID"
            else
              uv run atlas-data source nclimgrid-pilot-measure --action "$MEASUREMENT_ACTION"
            fi
          elif [ "${{ inputs.operation }}" = "january-source-registration" ]; then
            test "$SNOWFLAKE_DATABASE" = ONE_HEALTH_LYME_GAP_ATLAS_DEV
            test "$SNOWFLAKE_WAREHOUSE" = OH_LYME_DEV_INGEST_XS_WH
            uv run pytest tests/test_climate_source_review.py -q
            uv run python scripts/reconcile_january_climate_inputs.py --phase "$REGISTRATION_PHASE"
            uv run python scripts/reconcile_january_climate_inputs.py --phase inspect
          elif [ "${{ inputs.operation }}" = "run" ]; then
            extra_args=()
            if [ "${INTELLIGENCE_ACQUISITION_ONLY:-false}" = "true" ]; then
              extra_args+=(--fail-after-stage ACQUIRE)
            fi
            uv run atlas-data source run \
              --definition "$SOURCE_DEFINITION" \
              --tier "${{ inputs.tier }}" "${extra_args[@]}"
          elif [ "${{ inputs.operation }}" = "nclimgrid-batch" ]; then
            extra_args=()
            if [ "${{ inputs.recapture }}" = "true" ]; then
              extra_args+=(--recapture)
            fi
            uv run atlas-data source nclimgrid-batch \
              --definitions "$SOURCE_DEFINITION" \
              --tier "${{ inputs.tier }}" "${extra_args[@]}"
          else
            test -n "$INGESTION_RUN_ID"
            uv run atlas-data runs resume \
              --run-id "$INGESTION_RUN_ID" \
              --definition "$SOURCE_DEFINITION"
          fi
      - name: Retain read-only pilot inspection artifact
        if: always() && inputs.operation == 'nclimgrid-pilot-measurement' && inputs.measurement_action == 'frozen-membership'
        uses: actions/upload-artifact@v4
        with:
          name: source-pilot-inspection
          path: |
            ${{ runner.temp }}/source-pilot-inspection-artifact.json
            ${{ runner.temp }}/january-membership-diagnostic-receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Inspect definition
        if: inputs.operation == 'inspect'
        env:
          SOURCE_DEFINITION: ${{ inputs.source_definition }}
        run: uv run atlas-data source inspect --definition "$SOURCE_DEFINITION"
      - name: Publish gate note
        if: inputs.publish == true && inputs.environment_name == 'production'
        run: |
          echo "Tier C publish remains on protected promote-prod / publication controls."
          echo "This workflow invokes the same orchestrator entry point as the CLI."

