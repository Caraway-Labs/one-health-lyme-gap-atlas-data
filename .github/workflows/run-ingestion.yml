name: Run governed ingestion (generic)

# Epic #259 / Stories #254-255 — one Actions surface for source run/resume.
# Workflow YAML must not encode source business logic.

on:
  workflow_dispatch:
    inputs:
      source_definition:
        description: Path to SourceDefinition YAML under the repo
        required: true
        default: config/sources/cdc_x5j9_wybp.yml
        type: string
      environment_name:
        description: GitHub Environment (dev or production)
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production
      operation:
        description: Orchestrator operation
        required: true
        default: run
        type: choice
        options:
          - run
          - resume
          - validate
          - inspect
      tier:
        description: Risk tier (A local/fixture via job, B DEV, C PROD protected)
        required: true
        default: B
        type: choice
        options:
          - A
          - B
          - C
      run_id:
        description: Existing run id for resume/inspect
        required: false
        type: string
      publish:
        description: Request publish/stage (still subject to Tier C protections)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: run-ingestion-${{ inputs.environment_name }}-${{ inputs.source_definition }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Canonical ingestion entry point
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    env:
      TOPX_ENV: dev
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_AUTH_METHOD: key_pair
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SPACES_REGION: ${{ secrets.SPACES_REGION }}
      SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
      SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
      SPACES_PREFIX: ${{ secrets.SPACES_PREFIX }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install package
        run: uv sync --extra dev
      - name: Validate definition
        if: inputs.operation == 'validate' || inputs.operation == 'run'
        run: uv run atlas-data source validate --definition "${{ inputs.source_definition }}"
      - name: Enforce environment and tier boundary
        if: inputs.operation == 'run' || inputs.operation == 'resume'
        run: |
          if [ "${{ inputs.tier }}" = "B" ] && [ "${{ inputs.environment_name }}" != "dev" ]; then
            echo "::error::Tier B runs are limited to the dev GitHub Environment."
            exit 1
          fi
          if [ "${{ inputs.tier }}" = "C" ]; then
            echo "::error::Tier C execution belongs to the protected promote/publication workflows."
            exit 1
          fi
      - name: Execute orchestrator operation with ephemeral Snowflake key
        if: inputs.operation == 'run' || inputs.operation == 'resume'
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/oh-lyme-ingestion-key.p8"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"

          # The secret stores the PEM body. The shared connector expects the
          # base64 encoding of the complete PEM file, so normalize it only in
          # this ephemeral process environment and never print the key.
          export SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")"

          if [ "${{ inputs.operation }}" = "run" ]; then
            uv run atlas-data source run \
              --definition "${{ inputs.source_definition }}" \
              --tier "${{ inputs.tier }}"
          else
            test -n "${{ inputs.run_id }}"
            uv run atlas-data runs resume \
              --run-id "${{ inputs.run_id }}" \
              --definition "${{ inputs.source_definition }}"
          fi
      - name: Inspect definition
        if: inputs.operation == 'inspect'
        run: uv run atlas-data source inspect --definition "${{ inputs.source_definition }}"
      - name: Publish gate note
        if: inputs.publish == true && inputs.environment_name == 'production'
        run: |
          echo "Tier C publish remains on protected promote-prod / publication controls."
          echo "This workflow invokes the same orchestrator entry point as the CLI."
