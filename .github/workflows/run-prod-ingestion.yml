name: Run protected governed PROD ingestion

# Story #255: Tier C is available only through this protected workflow. The
# application service remains the single orchestration entry point; this file
# supplies production environment protection, identity checks, and credentials.

on:
  workflow_dispatch:
    inputs:
      january_normalize_recovery:
        description: One reviewed NORMALIZE recovery of retained DATA443 January PROD run only
        required: false
        type: boolean
        default: false
      january_bulk_repair_run_id:
        description: Successful exact-head V153 protected migration Actions run; recovery only
        required: false
        type: string
      source_definition:
        description: Path to SourceDefinition YAML under the repo
        required: true
        default: config/sources/cdc_x5j9_wybp.yml
        type: string
      operation:
        description: Run a new source release or resume a retained run
        required: true
        default: run
        type: choice
        options:
          - run
          - resume
      run_id:
        description: Retained resume ID or reviewed January PROD native capture ID
        required: false
        type: string
      release_commit:
        description: Exact commit reviewed for this protected execution
        required: true
        type: string
      source_version_id:
        description: Active approved source-version UUID bound to this execution
        required: false
        type: string
      source_decision_id:
        description: Immutable human-review decision UUID that approved the source version
        required: false
        type: string

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: prod-governed-ingestion-${{ inputs.source_definition }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Protected canonical PROD ingestion
    runs-on: ubuntu-latest
    environment: production
    env:
      JANUARY_NORMALIZE_RECOVERY: ${{ inputs.january_normalize_recovery }}
      JANUARY_BULK_REPAIR_RUN_ID: ${{ inputs.january_bulk_repair_run_id }}
      GH_TOKEN: ${{ github.token }}
      TOPX_ENV: prod
      ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS: ${{ (inputs.source_definition == 'config/sources/mrlc_annual_nlcd_c1v2_2025_demo_cohort.yml' || inputs.source_definition == 'config/sources/noaa_nclimgrid_daily_202501_prod.yml') && '60' || '' }}
      ENABLE_PRODUCTION_EXECUTION: "true"
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_RUNTIME_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_RUNTIME_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ inputs.source_definition == 'config/sources/noaa_nclimgrid_daily_202501_prod.yml' && 'OH_LYME_PROD_APPROVAL_XS_WH' || secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_AUTH_METHOD: key_pair
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_RUNTIME_PRIVATE_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_RUNTIME_PRIVATE_KEY_PASSPHRASE }}
      SPACES_REGION: ${{ secrets.SPACES_REGION }}
      SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
      SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
      SPACES_PREFIX: ${{ secrets.SPACES_PREFIX }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      SOURCE_DEFINITION: ${{ inputs.source_definition }}
      SOURCE_VERSION_ID: ${{ inputs.source_version_id }}
      SOURCE_DECISION_ID: ${{ inputs.source_decision_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed commit and definition
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.release_commit }}"
          test -f "${{ inputs.source_definition }}"
          if [[ "${{ inputs.january_normalize_recovery }}" == true ]]; then
            test "$GITHUB_REF" = refs/heads/main
            test "${{ inputs.source_definition }}" = config/sources/noaa_nclimgrid_daily_202501_prod.yml
            test "${{ inputs.operation }}" = resume
            test "${{ inputs.run_id }}" = d0e1e30b-49f1-5400-8345-af0b3e975114
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install package
        run: uv sync --extra dev --extra pipeline --locked
      - name: Validate definition
        run: uv run atlas-data source validate --definition "${{ inputs.source_definition }}"
      - name: Require exact reviewed EID-only production request
        if: (inputs.source_definition == 'config/sources/intelligence_cdc_eid_expedited.yml' || inputs.source_definition == 'config/sources/intelligence_cdc_eid_ahead_of_print.yml' || inputs.source_definition == 'config/sources/intelligence_cdc_outbreaks.yml')
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_OPERATION: ${{ inputs.operation }}
          REQUEST_RUN_ID: ${{ inputs.run_id }}
          REQUEST_SOURCE_VERSION_ID: ${{ inputs.source_version_id }}
          REQUEST_SOURCE_DECISION_ID: ${{ inputs.source_decision_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUEST_OPERATION" = run
          test -z "$REQUEST_RUN_ID"
          test -z "$REQUEST_SOURCE_VERSION_ID"
          test -z "$REQUEST_SOURCE_DECISION_ID"
          passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
          test "$passed_checks" -gt 0
      - name: Set reviewed January connection limits
        if: ${{ inputs.source_definition == 'config/sources/noaa_nclimgrid_daily_202501_prod.yml' }}
        run: |
          echo 'MAX_CON_RETRY_ATTEMPTS=0' >> "$GITHUB_ENV"
          echo 'SNOWFLAKE_NETWORK_TIMEOUT_SECONDS=65' >> "$GITHUB_ENV"
          echo 'ATLAS_JANUARY_PROD_SESSION=true' >> "$GITHUB_ENV"
      - name: Verify exact reviewed V153 deployment receipt
        if: ${{ inputs.january_normalize_recovery == true }}
        timeout-minutes: 4
        run: timeout --signal=INT --kill-after=15s 180s uv run python scripts/verify_january_bulk_repair_receipt.py
      - name: Verify protected PROD runtime identity and approved source decision
        if: inputs.source_definition != 'config/sources/intelligence_cdc_eid_expedited.yml'
        timeout-minutes: ${{ (inputs.source_definition == 'config/sources/mrlc_annual_nlcd_c1v2_2025_demo_cohort.yml' || inputs.source_definition == 'config/sources/noaa_nclimgrid_daily_202501_prod.yml') && 3 || 360 }}
        run: |
          set -euo pipefail
          for required_var in \
            SNOWFLAKE_ACCOUNT \
            SNOWFLAKE_USER \
            SNOWFLAKE_ROLE \
            SNOWFLAKE_WAREHOUSE \
            SNOWFLAKE_DATABASE \
            SNOWFLAKE_PRIVATE_KEY_B64 \
            SNOWFLAKE_PRIVATE_KEY_PASSPHRASE \
            SPACES_ENDPOINT \
            SPACES_BUCKET \
            SPACES_ACCESS_KEY_ID \
            SPACES_SECRET_ACCESS_KEY
          do
            if [ -z "${!required_var:-}" ]; then
              echo "::error::Missing protected PROD ingestion configuration: $required_var"
              exit 1
            fi
          done
          # The production environment stores the complete encrypted PKCS#8 PEM
          # file as base64. This is the exact format consumed by the shared
          # connector and avoids reconstructing PEM framing in the runner.

          uv run python - <<'PY'
          import os
          import uuid
          from pathlib import Path

          from lyme_gap_atlas_shared.settings import SnowflakeSettings
          from lyme_gap_atlas_data.sql_sessions import connect
          from lyme_gap_atlas_data.ingestion.source_definition import load_source_definition

          settings = SnowflakeSettings()
          source_version_id = str(uuid.UUID(os.environ["SOURCE_VERSION_ID"]))
          source_decision_id = str(uuid.UUID(os.environ["SOURCE_DECISION_ID"]))
          definition = load_source_definition(Path(os.environ["SOURCE_DEFINITION"]))
          with connect(settings) as connection, connection.cursor() as cursor:
              cursor.execute(
                  "SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_DATABASE(), "
                  "CURRENT_WAREHOUSE()"
              )
              identity = cursor.fetchone()
              cursor.execute(
                  """SELECT resource_key, status, approved_decision_id, retired_at
                     FROM GOVERNANCE.DATA_SOURCE_VERSIONS
                     WHERE data_source_version_id = %s""",
                  (source_version_id,),
              )
              approval = cursor.fetchone()
          expected = (
              "OH_LYME_PROD_PIPELINE_SVC",
              "OH_LYME_PROD_RUNTIME",
              "ONE_HEALTH_LYME_GAP_ATLAS_PROD",
              settings.snowflake_warehouse,
          )
          print(
              "Snowflake PROD runtime identity: "
              f"user={identity[0]}, role={identity[1]}, database={identity[2]}, "
              f"warehouse={identity[3]}"
          )
          if identity != expected:
              raise SystemExit(
                  "Protected Tier C ingestion requires the dedicated PROD "
                  "pipeline service identity."
              )
          if approval is None:
              raise SystemExit("Protected Tier C ingestion requires a recorded source decision.")
          if (
              approval[0] != definition.resource_key
              or approval[1] not in {"APPROVED", "CONDITIONAL"}
              or approval[2] != source_decision_id
              or approval[3] is not None
          ):
              raise SystemExit(
                  "Protected Tier C ingestion requires the supplied active approved "
                  "source version and immutable source decision."
              )
          PY
      - name: Execute canonical Tier C run or resume
        timeout-minutes: ${{ inputs.january_normalize_recovery && 31 || inputs.source_definition == 'config/sources/noaa_nclimgrid_daily_202501_prod.yml' && 301 || (inputs.source_definition == 'config/sources/intelligence_cdc_eid_expedited.yml' || inputs.source_definition == 'config/sources/intelligence_cdc_eid_ahead_of_print.yml' || inputs.source_definition == 'config/sources/intelligence_cdc_outbreaks.yml') && 6 || inputs.source_definition == 'config/sources/mrlc_annual_nlcd_c1v2_2025_demo_cohort.yml' && 5 || 360 }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.source_definition }}" = "config/sources/noaa_nclimgrid_daily_202501_prod.yml" ]; then
            test "${{ inputs.run_id }}" = d0e1e30b-49f1-5400-8345-af0b3e975114
            if [[ "${{ inputs.january_normalize_recovery }}" == true ]]; then
              test "${{ inputs.operation }}" = resume
              timeout --signal=INT --kill-after=15s 1800s uv run atlas-data runs resume \
                --definition "${{ inputs.source_definition }}" --run-id "${{ inputs.run_id }}"
              exit 0
            fi
            test "${{ inputs.operation }}" = run
            timeout --signal=INT --kill-after=15s 18000s uv run atlas-data source run \
              --definition "${{ inputs.source_definition }}" --tier C --run-id "${{ inputs.run_id }}"
          elif [ "${{ inputs.operation }}" = "run" ]; then
            uv run atlas-data source run \
              --definition "${{ inputs.source_definition }}" \
              --tier C
          else
            test -n "${{ inputs.run_id }}"
            uv run atlas-data runs resume \
              --run-id "${{ inputs.run_id }}" \
              --definition "${{ inputs.source_definition }}"
          fi
