name: Reconcile retained January climate inputs

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed data commit on main with passing quality
        required: true
        type: string
      phase:
        description: Inspect or register factual pending bindings; never approve or publish
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - register-pending

permissions:
  contents: read
  checks: read

concurrency:
  group: january-climate-registration-dev
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    env:
      TOPX_ENV: dev
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_RUNTIME_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_RUNTIME_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_AUTH_METHOD: key_pair
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_RUNTIME_PRIVATE_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_RUNTIME_PRIVATE_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_commit }}
          fetch-depth: 0
      - name: Verify reviewed checkout and bounded phase
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          PHASE: ${{ inputs.phase }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          git merge-base --is-ancestor "$REVIEWED_COMMIT" origin/main
          case "$PHASE" in inspect|register-pending) ;; *) exit 1 ;; esac
          passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs" \
            --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
          test "$passed_checks" -gt 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Verify reconciliation regression checks
        run: uv run pytest tests/test_climate_source_review.py -q
      - name: Run bounded reconciliation and readback
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/january-climate-runtime-key.p8"
          trap 'rm -f "$key_file"' EXIT
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          export SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")"
          uv run python - <<'PY'
          from lyme_gap_atlas_shared.settings import SnowflakeSettings
          from lyme_gap_atlas_shared.snowflake import connect
          with connect(SnowflakeSettings()) as connection, connection.cursor() as cursor:
              cursor.execute("SELECT CURRENT_USER(),CURRENT_ROLE(),CURRENT_DATABASE(),CURRENT_WAREHOUSE()")
              identity = cursor.fetchone()
          expected = (
              "OH_LYME_DEV_PIPELINE_SVC", "OH_LYME_DEV_RUNTIME",
              "ONE_HEALTH_LYME_GAP_ATLAS_DEV", "OH_LYME_DEV_INGEST_XS_WH",
          )
          if tuple(identity) != expected:
              raise SystemExit("JANUARY_REGISTRATION_RUNTIME_IDENTITY")
          print("Verified dedicated DEV January registration runtime identity")
          PY
          uv run python scripts/reconcile_january_climate_inputs.py --phase "$PHASE"
          uv run python scripts/reconcile_january_climate_inputs.py --phase inspect
