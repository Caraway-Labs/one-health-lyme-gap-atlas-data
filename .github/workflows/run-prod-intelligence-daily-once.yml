name: Run bounded PROD intelligence daily operation once

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Exact immutable pipeline image active in DEV and PROD
        required: true
        type: string
      reviewed_commit:
        description: Exact reviewed main commit whose pipeline image is deployed
        required: true
        type: string
      preflight_only:
        description: Run provider-free readiness only; no acquisition
        required: false
        default: false
        type: boolean
      recover_ingestion_run_id:
        description: Optional RUNNING intelligence-daily run to terminalize before another attempt
        required: false
        default: ""
        type: string
      reopen_attempt:
        description: Same-UTC-day re-run of one source whose previous attempt is terminal FAILED. Use 2 or 3 (hard cap). Requires source_id. Each attempt is a new ledger row. No separate approval; the run URL and an issue comment are the audit trail.
        required: false
        default: 1
        type: number
      source_id:
        description: Registered daily source id. Required when reopen_attempt is 2 or 3 and when recovering a stuck run. none and all are rejected in those modes. A normal run (none) ignores this and runs every approved source. PubMed ids are accepted only when reopen_attempt is 2 or 3.
        required: false
        default: none
        type: choice
        options:
          - none
          - cdc-eid-expedited
          - cdc-eid-ahead-of-print
          - cdc-outbreaks
          - nih-news-releases
          - cdc-mmwr
          - pubmed-tick-borne
          - pubmed-lyme-borrelia
      reason:
        description: Why this run is dispatched (required, 200 characters maximum)
        required: true
        type: string

permissions:
  contents: read
  checks: read

# Shared with every other PROD app-spec mutator. One daily-once run at a time,
# and it cannot overlap a promotion or another topology change.
concurrency:
  group: prod-app-topology
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The manual PRE_DEPLOY job timeout is 1h35m (one full pass, no retry).
    timeout-minutes: 120
    environment: production
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DEV_APP_ID: b33dbae7-e243-4e27-b3ca-1018f5897f87
      PROD_APP_ID: ${{ vars.PROD_APP_ID }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
      RECOVER_INGESTION_RUN_ID: ${{ inputs.recover_ingestion_run_id }}
      REOPEN_ATTEMPT: ${{ inputs.reopen_attempt }}
      SOURCE_ID: ${{ inputs.source_id }}
      DISPATCH_REASON: ${{ inputs.reason }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: "1.160.1"
      - name: Validate dispatch reason
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          INTEL_DAILY_WORK="${INTEL_DAILY_WORK:-${RUNNER_TEMP}/intelligence-daily-once}"
          mkdir -p "$INTEL_DAILY_WORK"
          chmod 700 "$INTEL_DAILY_WORK"
          python scripts/prod_intelligence_daily_job_spec.py \
            --mode validate-reason --reason="$DISPATCH_REASON"
      - name: Capture baseline and build one-shot spec
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          # Full pass: 16:40 through 18:15 America/Denver, so a 1h35m run started
          # at 16:39 ends before the 18:15 cron. A single-source re-run (attempt
          # 2 or 3) keeps 17:00 through 18:15. Local clock, including November.
          denver_hm="$(TZ=America/Denver date +%H%M)"
          window_start=1640
          if [[ "${REOPEN_ATTEMPT:-1}" =~ ^[2-3]$ && -n "${SOURCE_ID}" && "$SOURCE_ID" != "none" ]]; then
            window_start=1700
          fi
          if [[ "$denver_hm" -ge "$window_start" && "$denver_hm" -le 1815 ]]; then
            echo "::error::INTELLIGENCE_DAILY_MANUAL_WINDOW_CLOSED"
            exit 1
          fi
          INTEL_DAILY_WORK="${INTEL_DAILY_WORK:-${RUNNER_TEMP}/intelligence-daily-once}"
          source scripts/ci/guard.sh
          guard_nonempty prod_app_id "$PROD_APP_ID" "PROD_APP_ID is empty. Set the PROD_APP_ID repository variable to the provisioned production app before dispatching."
          CODE_SHA="$REVIEWED_COMMIT"
          [[ "$CODE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CODE_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
          guard_gt quality_checks 0 "$passed_checks" "No successful Quality run was found for this commit. Wait for Quality to pass on main before dispatching."
          source_digest="$(doctl registry repository list-manifests pipeline --output json \
            | jq -r --arg tag "sha-${CODE_SHA}" '.[] | select(.tags | index($tag)) | .digest')"
          guard_eq registry_source_digest "$IMAGE_DIGEST" "$source_digest" "The registry manifest tagged sha-GITHUB_SHA does not match IMAGE_DIGEST. Re-run with the digest from the latest successful deploy-dev run for this commit."

          mkdir -p "$INTEL_DAILY_WORK"
          chmod 700 "$INTEL_DAILY_WORK"
          baseline_spec="$INTEL_DAILY_WORK/baseline.json"
          operation_spec="$INTEL_DAILY_WORK/operation.json"
          dev_spec="$INTEL_DAILY_WORK/dev.json"
          doctl apps spec get "$PROD_APP_ID" --format json > "$baseline_spec"
          chmod 600 "$baseline_spec"
          dev_deployment_id="$(doctl apps get "$DEV_APP_ID" --output json | jq -r '.[0].active_deployment.id')"
          prod_deployment_id="$(doctl apps get "$PROD_APP_ID" --output json | jq -r '.[0].active_deployment.id')"
          dev_phase="$(doctl apps get-deployment "$DEV_APP_ID" "$dev_deployment_id" --output json | jq -r '.[0].phase')"
          guard_eq dev_deployment_phase ACTIVE "$dev_phase" "The DEV deployment is not ACTIVE. Wait until the DEV deployment phase is ACTIVE before running the daily job."
          prod_phase="$(doctl apps get-deployment "$PROD_APP_ID" "$prod_deployment_id" --output json | jq -r '.[0].phase')"
          guard_eq prod_deployment_phase ACTIVE "$prod_phase" "The PROD deployment is not ACTIVE. Wait until the PROD deployment phase is ACTIVE before running the daily job."
          doctl apps spec get "$DEV_APP_ID" --deployment "$dev_deployment_id" --format json > "$dev_spec"
          chmod 600 "$dev_spec"
          dev_job_digest="$(jq -r '[.jobs[].image.digest] | unique | .[0]' "$dev_spec")"
          guard_eq dev_job_digest "$IMAGE_DIGEST" "$dev_job_digest" "DEV job image digests are not the single IMAGE_DIGEST. Promote or deploy so every DEV job uses that digest."
          dev_job_digest_count="$(jq -r '[.jobs[].image.digest] | unique | length' "$dev_spec")"
          guard_eq dev_job_digest_count 1 "$dev_job_digest_count" "DEV jobs do not share one image digest. Promote or deploy so every DEV job uses the same digest."
          daily_job_digest="$(jq -r '.jobs[] | select(.name == "intelligence-feed-daily") | .image.digest' "$baseline_spec")"
          guard_eq intelligence_feed_daily_digest "$IMAGE_DIGEST" "$daily_job_digest" "The PROD intelligence-feed-daily image digest does not match IMAGE_DIGEST. Refresh that job to the reviewed digest before running it."

          build_args=(
            --mode build
            --baseline "$baseline_spec"
            --output "$operation_spec"
          )
          if [[ "$PREFLIGHT_ONLY" == "true" ]]; then
            build_args+=(--preflight-only)
          fi
          if [[ "$SOURCE_ID" == "none" ]]; then
            SOURCE_ID=""
          fi
          # Patterns are literal. A "|" taken from a variable is one character, not alternation.
          if [[ ! "${REOPEN_ATTEMPT:-1}" =~ ^[1-3]$ ]]; then
            if [[ "${REOPEN_ATTEMPT:-1}" =~ ^[0-9]+$ ]] && [[ "${REOPEN_ATTEMPT:-1}" -gt 3 ]]; then
              echo "::error::INTELLIGENCE_DAILY_ATTEMPT_CAP"
            else
              echo "::error::INTELLIGENCE_DAILY_REOPEN_ATTEMPT_INVALID"
            fi
            exit 1
          fi
          if [[ -n "$RECOVER_INGESTION_RUN_ID" ]]; then
            if [[ -z "${SOURCE_ID}" || "$SOURCE_ID" == "all" ]]; then
              echo "::error::INTELLIGENCE_DAILY_RECOVERY_SOURCE_REQUIRED"
              exit 1
            fi
            case "$SOURCE_ID" in
              cdc-eid-expedited|cdc-eid-ahead-of-print|cdc-outbreaks|nih-news-releases|cdc-mmwr) ;;
              *) echo "::error::INTELLIGENCE_DAILY_SOURCE_SELECTION_INVALID"; exit 1 ;;
            esac
            build_args+=(--recover-ingestion-run-id "$RECOVER_INGESTION_RUN_ID" --source "$SOURCE_ID")
          fi
          if [[ "${REOPEN_ATTEMPT:-1}" -ge 2 ]] 2>/dev/null; then
            if [[ -z "${SOURCE_ID}" || "$SOURCE_ID" == "all" ]]; then
              echo "::error::INTELLIGENCE_DAILY_REOPEN_SOURCE_REQUIRED"
              exit 1
            fi
            case "$SOURCE_ID" in
              cdc-eid-expedited|cdc-eid-ahead-of-print|cdc-outbreaks|nih-news-releases|cdc-mmwr) ;;
              pubmed-tick-borne|pubmed-lyme-borrelia) ;;
              *) echo "::error::INTELLIGENCE_DAILY_SOURCE_SELECTION_INVALID"; exit 1 ;;
            esac
            build_args+=(--reopen-attempt "$REOPEN_ATTEMPT" --source "$SOURCE_ID")
          elif [[ "$SOURCE_ID" == "pubmed-tick-borne" || "$SOURCE_ID" == "pubmed-lyme-borrelia" ]]; then
            echo "::error::INTELLIGENCE_DAILY_SOURCE_SELECTION_INVALID"
            exit 1
          fi
          python scripts/prod_intelligence_daily_job_spec.py "${build_args[@]}"
          chmod 600 "$operation_spec"
          rm -f "$dev_spec"
          : > "$INTEL_DAILY_WORK/ready"
      - name: Apply one-shot intelligence-daily job
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          INTEL_DAILY_WORK="${INTEL_DAILY_WORK:-${RUNNER_TEMP}/intelligence-daily-once}"
          work="$INTEL_DAILY_WORK"
          if [[ ! -f "$work/ready" ]]; then
            exit 0
          fi
          printf '1\n' > "$work/operation_status"
          : > "$work/deployment_id"
          chmod 600 "$work/operation_status" "$work/deployment_id"
          update_output="$work/update-output.txt"
          : > "$update_output"
          chmod 600 "$update_output"
          operation_status=1
          set +e
          doctl apps update "$PROD_APP_ID" --spec "$work/operation.json" --wait \
            --format ID,ActiveDeployment.ID --no-header >"$update_output" 2>&1
          operation_status=$?
          set -e
          printf '%s\n' "$operation_status" > "$work/operation_status"
          deployment_id="$(
            python scripts/prod_intelligence_daily_job_spec.py \
              --mode deployment-id --deployment-output "$update_output" || true
          )"
          if [[ ! "$deployment_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            deployment_id=""
          fi
          printf '%s\n' "$deployment_id" > "$work/deployment_id"
          rm -f "$update_output" "$work/operation.json"
          printf 'operation_status=%s\n' "$operation_status"
          if [[ -n "$deployment_id" ]]; then
            printf 'deployment_id=%s\n' "$deployment_id"
          else
            printf 'deployment_id=unavailable\n'
          fi
          exit 0
      - name: Report per-source daily outcomes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          INTEL_DAILY_WORK="${INTEL_DAILY_WORK:-${RUNNER_TEMP}/intelligence-daily-once}"
          work="$INTEL_DAILY_WORK"
          if [[ ! -f "$work/ready" ]]; then
            exit 0
          fi
          deployment_id=""
          if [[ -f "$work/deployment_id" ]]; then
            deployment_id="$(tr -d '[:space:]' < "$work/deployment_id")"
          fi
          if [[ ! "$deployment_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            deployment_id=""
          fi
          log_file="$work/job.log"
          : >"$log_file"
          chmod 600 "$log_file"
          logs_missing=1
          if [[ -n "$deployment_id" ]]; then
            logs_missing=0
            timeout 120 doctl apps logs "$PROD_APP_ID" intelligence-daily-manual-once \
              --deployment "$deployment_id" --type run --tail 2000 --no-prefix \
              >"$log_file" 2>"$work/job.log.err" || true
          fi
          outcome_args=(
            --mode render-outcomes
            --logs "$log_file"
            --rows "$work/rows.json"
          )
          if [[ "$logs_missing" == "1" ]]; then
            outcome_args+=(--logs-missing)
          fi
          python scripts/prod_intelligence_daily_job_spec.py "${outcome_args[@]}"
          rm -f "$log_file" "$work/job.log.err"
      - name: Restore baseline topology
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          INTEL_DAILY_WORK="${INTEL_DAILY_WORK:-${RUNNER_TEMP}/intelligence-daily-once}"
          work="$INTEL_DAILY_WORK"
          if [[ ! -f "$work/ready" ]]; then
            exit 0
          fi
          restore_output="$work/restore-output.txt"
          : > "$restore_output"
          chmod 600 "$restore_output"
          restore_status=1
          set +e
          doctl apps update "$PROD_APP_ID" --spec "$work/baseline.json" --wait \
            --format ID,ActiveDeployment.ID --no-header >"$restore_output" 2>&1
          restore_status=$?
          set -e
          printf '%s\n' "$restore_status" > "$work/restore_cli_status"
          rm -f "$restore_output"
          printf 'restore_cli_status=%s\n' "$restore_status"
          exit 0
      - name: Verify restored spec digest
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          INTEL_DAILY_WORK="${INTEL_DAILY_WORK:-${RUNNER_TEMP}/intelligence-daily-once}"
          work="$INTEL_DAILY_WORK"
          cleanup() {
            rm -f \
              "$work/baseline.json" \
              "$work/restored.json" \
              "$work/rows.json" \
              "$work/operation.json" \
              "$work/dev.json" \
              "$work/job.log" \
              "$work/job.log.err" \
              "$work/update-output.txt" \
              "$work/restore-output.txt" \
              "$work/deployment_id" \
              "$work/operation_status" \
              "$work/restore_cli_status" \
              "$work/ready"
          }
          trap cleanup EXIT
          if [[ ! -f "$work/ready" ]]; then
            exit 0
          fi
          restored_spec="$work/restored.json"
          spec_status=0
          set +e
          doctl apps spec get "$PROD_APP_ID" --format json >"$restored_spec"
          spec_status=$?
          set -e
          if [[ "$spec_status" -ne 0 ]]; then
            rm -f "$restored_spec"
          fi
          if [[ -f "$restored_spec" ]]; then
            chmod 600 "$restored_spec"
          fi
          operation_status=""
          if [[ -f "$work/operation_status" ]]; then
            operation_status="$(tr -cd '0-9' < "$work/operation_status")"
          fi
          if [[ -z "$operation_status" ]]; then
            operation_status=1
          fi
          restored_flag=no
          if [[ -f "$restored_spec" ]]; then
            if python scripts/prod_intelligence_daily_job_spec.py --mode compare-specs \
              --baseline "$work/baseline.json" \
              --restored "$restored_spec"; then
              restored_flag=yes
            fi
          fi
          set +e
          python scripts/prod_intelligence_daily_job_spec.py --mode render-result \
            --rows "$work/rows.json" \
            --operation-status "$operation_status" \
            --restored-flag "$restored_flag"
          result_status=$?
          set -e
          exit "$result_status"
