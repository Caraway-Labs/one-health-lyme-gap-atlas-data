name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: Deploy the reviewed commit to DEV after quality checks
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scanning must inspect history, not just the triggering commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --extra dev --extra pipeline --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - run: docker build --tag one-health-lyme-gap-atlas-data:ci .
      - run: docker run --rm one-health-lyme-gap-atlas-data:ci /app/.venv/bin/atlas-data pipeline --help
      - name: Verify packaged dbt project without Snowflake access
        run: docker run --rm one-health-lyme-gap-atlas-data:ci /app/.venv/bin/dbt parse --project-dir /app/dbt --profiles-dir /app/dbt --no-partial-parse
      - run: uv run atlas-data provision --dry-run
      - run: uv run atlas-data load --release alpha-2026-08-06 --dry-run
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  deploy_dev:
    name: Build and deploy immutable DEV image
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      APP_ID: b33dbae7-e243-4e27-b3ca-1018f5897f87
      IMAGE: registry.digitalocean.com/oh-lyme-data/pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: "1.160.1"
      - name: Build and publish immutable image
        id: image
        run: |
          doctl registry login --expiry-seconds 1200
          tag="sha-${GITHUB_SHA}"
          docker build --platform linux/amd64 --tag "${IMAGE}:${tag}" .
          docker push "${IMAGE}:${tag}"
          digest=""
          for attempt in $(seq 1 12); do
            digest="$(doctl registry repository list-manifests pipeline --output json \
              | jq -r --arg tag "$tag" '.[] | select(.tags | index($tag)) | .digest')"
            test -n "$digest" && break
            sleep 5
          done
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Deploy the tested digest to DEV
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          umask 077
          doctl apps spec get "$APP_ID" --format json > /tmp/dev-app.json
          restore_baseline() {
            code=$?
            if [ "$code" -ne 0 ]; then
              doctl apps update "$APP_ID" --spec /tmp/dev-app.json --wait \
                --format ID,ActiveDeployment.ID --no-header || true
            fi
            rm -f /tmp/dev-app.json /tmp/dev-app-image.json /tmp/dev-app-fixture.json
            exit "$code"
          }
          trap restore_baseline EXIT
          jq --arg digest "$IMAGE_DIGEST" '
            .jobs |= map(
              del(.github, .dockerfile_path, .source_dir)
              | .image = {
                  registry_type: "DOCR",
                  registry: "oh-lyme-data",
                  repository: "pipeline",
                  digest: $digest
                }
            )
          ' /tmp/dev-app.json > /tmp/dev-app-image.json
          test "$(jq '[.jobs[] | select(.name == "catalog-ingestion")] | length' /tmp/dev-app-image.json)" = "1"
          test "$(jq '[.jobs[] | select(.name == "cdc-policy-fixtures-once")] | length' /tmp/dev-app-image.json)" = "0"
          jq '
            (.jobs[] | select(.name == "catalog-ingestion")) as $runtime
            | .jobs += [$runtime | .name = "cdc-policy-fixtures-once"
              | .kind = "PRE_DEPLOY" | del(.schedule)
              | .run_command = "/app/.venv/bin/python /app/scripts/verify_cdc_policy_dev.py"]
          ' /tmp/dev-app-image.json > /tmp/dev-app-fixture.json
          # The actual DEV runtime identity executes session-temporary fixtures.
          # A failed proof prevents this image from becoming the active deployment.
          doctl apps update "$APP_ID" --spec /tmp/dev-app-fixture.json --wait \
            --format ID,ActiveDeployment.ID --no-header
          # Remove only the temporary proof job, retaining the tested digest.
          doctl apps update "$APP_ID" --spec /tmp/dev-app-image.json --wait \
            --format ID,ActiveDeployment.ID --no-header
