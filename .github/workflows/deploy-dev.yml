name: Verify DEV governed pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Snowflake CLI
        run: python -m pip install snowflake-cli-labs==3.25.0
      - run: uv sync --frozen --extra dev --extra pipeline
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - run: docker build -t one-health-lyme-gap-atlas-data .
      - name: Configure and verify the DEV Snowflake service connection
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/oh-lyme-dev-pipeline-key.p8"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | base64 --decode > "$key_file"
          export SNOWFLAKE_CONNECTIONS_OH_LYME_DEV_ACCOUNT="$SNOWFLAKE_ACCOUNT"
          export SNOWFLAKE_CONNECTIONS_OH_LYME_DEV_USER="$SNOWFLAKE_USER"
          export SNOWFLAKE_CONNECTIONS_OH_LYME_DEV_ROLE="$SNOWFLAKE_ROLE"
          export SNOWFLAKE_CONNECTIONS_OH_LYME_DEV_WAREHOUSE="$SNOWFLAKE_WAREHOUSE"
          export SNOWFLAKE_CONNECTIONS_OH_LYME_DEV_DATABASE="$SNOWFLAKE_DATABASE"
          export SNOWFLAKE_CONNECTIONS_OH_LYME_DEV_AUTHENTICATOR="SNOWFLAKE_JWT"
          export SNOWFLAKE_CONNECTIONS_OH_LYME_DEV_PRIVATE_KEY_PATH="$key_file"
          export SNOWFLAKE_CONNECTIONS_OH_LYME_DEV_PRIVATE_KEY_PASSPHRASE="$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE"
          snow sql -c oh_lyme_dev \
            -q "SELECT CURRENT_ACCOUNT(), CURRENT_USER(), CURRENT_ROLE()" --format JSON
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
