name: Verify DEV governed pipeline
on:
  workflow_dispatch:
    inputs:
      release_integrity_fixture:
        description: Independently reviewed RI706-only synthetic fixture install and acceptance
        type: boolean
        default: false
      ri706_expected_artifacts:
        description: Exact V157/V158 original and rendered artifact JSON from the reviewed checkout
        type: string
        required: false
      ri706_synthetic_authorization:
        description: Must equal RI706_DEV_SYNTHETIC_TEST_ONLY_NOT_SCIENTIFIC_APPROVAL
        type: string
        required: false
      ri706_recovery_run_id:
        description: Prior owner-authorized failed fixture run with the identical installed V157/V158 pair
        type: string
        required: false
        default: ""
      ledger_diagnostic_only:
        description: Fixed three-statement ledger evidence diagnostic; requires metadata_preflight_only
        required: false
        type: boolean
        default: false
      metadata_preflight_only:
        description: Fixed 18-statement V147 DEV metadata preflight only; approved 7 USD ceiling
        required: false
        type: boolean
        default: false
      expected_pending_json:
        description: Reviewed exact pending version/filename/sha256 JSON array; required for mutation, [] for none
        required: false
        type: string
      diagnose_intelligence_dev:
        description: Fixed read-only feed metadata preflight; private artifact, no migrations
        required: false
        type: boolean
        default: false
      register_eid_expedited_dev:
        description: Register only the exact reviewed EID Expedited source document; no migrations
        required: false
        type: boolean
        default: false
      feed_preflight_accounting_confirmed:
        description: Confirm forward-only US$8 allowance covers this bounded probe; historical charges remain separate
        required: false
        type: boolean
        default: false
      diagnose_query_id:
        description: Optional failed migration DDL query ID; inspect only, without applying migrations
        required: false
        type: string
      diagnose_v103_state:
        description: Inspect V103 DEV migration state with the protected migration identity; read-only
        required: false
        type: boolean
        default: false
      diagnose_legacy_dev_reconciliations:
        description: Verify only the exact V028/V029/V033 DEV reconciliation records; read-only
        required: false
        type: boolean
        default: false
      diagnose_v143_cleanup_owner:
        description: Fixed read-only migration-owner V143 procedure and empty cleanup-table readback
        required: false
        type: boolean
        default: false
      diagnose_climate_dev:
        description: Fixture-only numeric/large-manifest DEV validation; no migration apply or release writes
        required: false
        type: boolean
        default: false
      diagnose_climate_views:
        description: Read-only DEV postapply view definitions, grants, counts and bounded history
        required: false
        type: boolean
        default: false
      diagnose_january_pair:
        description: One bounded DEV donor and membership sequence; job-local private handoff only
        required: false
        type: boolean
        default: false
      diagnose_january_runtime_init:
        description: One protected DEV runtime connection initialization; no SQL or donor export
        required: false
        type: boolean
        default: false
      january_budget_evidence:
        description: Redacted official price and existing owner Standard account evidence JSON
        required: false
        type: string
      reviewed_commit:
        description: Exact reviewed green main SHA for bounded January work or EID registration
        required: false
        type: string
permissions:
  contents: read
  checks: read
jobs:
  deploy:
    if: inputs.release_integrity_fixture != true && inputs.ri706_recovery_run_id == ''
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pinned-history regression tests require historical source commits.
      - uses: astral-sh/setup-uv@v6
      - name: Install Snowflake CLI
        run: python -m pip install snowflake-cli-labs==3.25.0
      - run: uv sync --frozen --extra dev --extra pipeline
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - run: docker build -t one-health-lyme-gap-atlas-data .
      - name: Configure and verify the DEV Snowflake service connection
        run: |
          set -euo pipefail
          if [ "$LEDGER_DIAGNOSTIC_ONLY" = "true" ]; then
            test "$METADATA_PREFLIGHT_ONLY" = "true"
          fi
          if [ "$METADATA_PREFLIGHT_ONLY" = "true" ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$EXPECTED_PENDING_JSON" = '[]'
            [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
            test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
            for other_mode in "$REGISTER_EID_EXPEDITED_DEV" "$DIAGNOSE_V143_CLEANUP_OWNER" \
              "$DIAGNOSE_JANUARY_PAIR" "$DIAGNOSE_JANUARY_RUNTIME_INIT" \
              "$DIAGNOSE_LEGACY_DEV_RECONCILIATIONS" "$DIAGNOSE_INTELLIGENCE_DEV" \
              "$DIAGNOSE_CLIMATE_DEV" "$DIAGNOSE_V103_STATE" "$DIAGNOSE_CLIMATE_VIEWS" \
              "$FEED_PREFLIGHT_ACCOUNTING_CONFIRMED"; do
              test "$other_mode" != "true"
            done
            test -z "$DIAGNOSE_QUERY_ID"
            test -n "$JANUARY_DIAGNOSTIC_BUDGET_EVIDENCE"
            test "$SNOWFLAKE_USER" = OH_LYME_DEV_MIGRATION_DEPLOY_SVC
            test "$SNOWFLAKE_ROLE" = OH_LYME_DEV_MIGRATION_DEPLOYER
            test "$SNOWFLAKE_DATABASE" = ONE_HEALTH_LYME_GAP_ATLAS_DEV
            test "$SNOWFLAKE_WAREHOUSE" = OH_LYME_DEV_INGEST_XS_WH
            passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
            test "$passed_checks" -gt 0
            # Secrets stay process-local. The shared connector expects full PEM
            # encoded as base64; workflow secrets contain the encrypted PEM body.
            key_file="$RUNNER_TEMP/oh-lyme-dev-metadata-preflight-key.p8"
            trap 'rm -f "$key_file"' EXIT
            umask 077
            {
              printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
              printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
              printf '\n%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
            } > "$key_file"
            SNOWFLAKE_AUTH_METHOD=key_pair \
            SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
            MAX_CON_RETRY_ATTEMPTS=0 \
            timeout --signal=INT --kill-after=15s 180s uv run python scripts/preflight_climate_v147_dev.py
            exit 0
          fi
          key_file="$RUNNER_TEMP/oh-lyme-dev-pipeline-key.p8"
          config_file="$RUNNER_TEMP/snowflake-connections.toml"
          trap 'rm -f "$key_file" "$config_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          cat > "$config_file" <<EOF
          [connections.oh_lyme_dev]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          role = "$SNOWFLAKE_ROLE"
          warehouse = "$SNOWFLAKE_WAREHOUSE"
          database = "$SNOWFLAKE_DATABASE"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "$key_file"
          private_key_passphrase = "$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE"
          EOF
          if [ "$DIAGNOSE_CLIMATE_VIEWS" = true ]; then
            test "$EXPECTED_PENDING_JSON" = '[]'
            for other_mode in "$REGISTER_EID_EXPEDITED_DEV" "$DIAGNOSE_V143_CLEANUP_OWNER" \
              "$DIAGNOSE_JANUARY_PAIR" "$DIAGNOSE_JANUARY_RUNTIME_INIT" \
              "$DIAGNOSE_LEGACY_DEV_RECONCILIATIONS" "$DIAGNOSE_INTELLIGENCE_DEV" \
              "$DIAGNOSE_CLIMATE_DEV" "$DIAGNOSE_V103_STATE"; do
              test "$other_mode" != "true"
            done
            test -z "$DIAGNOSE_QUERY_ID"
          fi
          if [ "$REGISTER_EID_EXPEDITED_DEV" = "true" ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$EXPECTED_PENDING_JSON" = '[]'
            test "$FEED_PREFLIGHT_ACCOUNTING_CONFIRMED" = "true"
            test "$DIAGNOSE_INTELLIGENCE_DEV" != "true"
            test "$DIAGNOSE_V143_CLEANUP_OWNER" != "true"
            test "$DIAGNOSE_LEGACY_DEV_RECONCILIATIONS" != "true"
            test "$DIAGNOSE_CLIMATE_VIEWS" != "true"
            test "$DIAGNOSE_CLIMATE_DEV" != "true"
            test "$DIAGNOSE_V103_STATE" != "true"
            test "$DIAGNOSE_JANUARY_PAIR" != "true"
            test "$DIAGNOSE_JANUARY_RUNTIME_INIT" != "true"
            test -z "$DIAGNOSE_QUERY_ID"
            [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
            test "$SNOWFLAKE_USER" = OH_LYME_DEV_MIGRATION_DEPLOY_SVC
            test "$SNOWFLAKE_ROLE" = OH_LYME_DEV_MIGRATION_DEPLOYER
            test "$SNOWFLAKE_DATABASE" = ONE_HEALTH_LYME_GAP_ATLAS_DEV
            test "$SNOWFLAKE_WAREHOUSE" = OH_LYME_DEV_INGEST_XS_WH
            passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs" \
              --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
            test "$passed_checks" -gt 0
            SNOWFLAKE_AUTH_METHOD=key_pair \
            SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
              timeout 125s uv run python scripts/register_eid_expedited_dev.py
            exit 0
          fi
          if [ "$DIAGNOSE_V143_CLEANUP_OWNER" = "true" ]; then
            test "$GITHUB_REF" = refs/heads/main
            test -z "$EXPECTED_PENDING_JSON"
            test "$DIAGNOSE_INTELLIGENCE_DEV" != "true"
            test "$DIAGNOSE_LEGACY_DEV_RECONCILIATIONS" != "true"
            test "$DIAGNOSE_CLIMATE_VIEWS" != "true"
            test "$DIAGNOSE_CLIMATE_DEV" != "true"
            test "$DIAGNOSE_V103_STATE" != "true"
            test "$DIAGNOSE_JANUARY_PAIR" != "true"
            test "$DIAGNOSE_JANUARY_RUNTIME_INIT" != "true"
            test -z "$DIAGNOSE_QUERY_ID"
            test -z "$JANUARY_DIAGNOSTIC_BUDGET_EVIDENCE"
            test -z "$REVIEWED_COMMIT"
            test "$FEED_PREFLIGHT_ACCOUNTING_CONFIRMED" != "true"
            test "$SNOWFLAKE_USER" = OH_LYME_DEV_MIGRATION_DEPLOY_SVC
            test "$SNOWFLAKE_ROLE" = OH_LYME_DEV_MIGRATION_DEPLOYER
            test "$SNOWFLAKE_DATABASE" = ONE_HEALTH_LYME_GAP_ATLAS_DEV
            test "$SNOWFLAKE_WAREHOUSE" = OH_LYME_DEV_INGEST_XS_WH
            timeout 120s uv run python scripts/diagnose_v143_cleanup_owner.py --config-file "$config_file"
            exit 0
          fi
          if [ "$DIAGNOSE_JANUARY_RUNTIME_INIT" = "true" ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$EXPECTED_PENDING_JSON" = '[]'
            test "$DIAGNOSE_JANUARY_PAIR" != "true"
            test "$DIAGNOSE_INTELLIGENCE_DEV" != "true"
            test "$DIAGNOSE_CLIMATE_VIEWS" != "true"
            test "$DIAGNOSE_CLIMATE_DEV" != "true"
            test "$DIAGNOSE_V103_STATE" != "true"
            test "$DIAGNOSE_LEGACY_DEV_RECONCILIATIONS" != "true"
            test -z "$DIAGNOSE_QUERY_ID"
            test "$RUNTIME_USER" = OH_LYME_DEV_PIPELINE_SVC
            test "$RUNTIME_ROLE" = OH_LYME_DEV_RUNTIME
            test -n "$SNOWFLAKE_ACCOUNT"
            test "$SNOWFLAKE_DATABASE" = ONE_HEALTH_LYME_GAP_ATLAS_DEV
            test "$SNOWFLAKE_WAREHOUSE" = OH_LYME_DEV_INGEST_XS_WH
            test -n "$RUNTIME_PRIVATE_KEY_B64"
            test -n "$RUNTIME_PRIVATE_KEY_PASSPHRASE"
            test -n "$JANUARY_DIAGNOSTIC_BUDGET_EVIDENCE"
            runtime_key_file="$RUNNER_TEMP/january-runtime-init-key.p8"
            trap 'rm -f "$key_file" "$config_file" "$runtime_key_file"' EXIT
            umask 077
            {
              printf '%s%s\n' '-----BEGIN ENCRYPTED ' 'PRIVATE KEY-----'
              printf '%s' "$RUNTIME_PRIVATE_KEY_B64" | fold -w 64
              printf '%s%s\n' '-----END ENCRYPTED ' 'PRIVATE KEY-----'
            } > "$runtime_key_file"
            runtime_key="$(base64 --wrap=0 "$runtime_key_file")"
            SNOWFLAKE_USER="$RUNTIME_USER" SNOWFLAKE_ROLE="$RUNTIME_ROLE" \
              SNOWFLAKE_PRIVATE_KEY_B64="$runtime_key" \
              SNOWFLAKE_PRIVATE_KEY_PASSPHRASE="$RUNTIME_PRIVATE_KEY_PASSPHRASE" \
              SNOWFLAKE_AUTH_METHOD=key_pair MAX_CON_RETRY_ATTEMPTS=0 \
              env -u RUNTIME_USER -u RUNTIME_ROLE -u RUNTIME_PRIVATE_KEY_B64 -u RUNTIME_PRIVATE_KEY_PASSPHRASE \
                timeout 25s uv run python scripts/verify_january_runtime_init.py
            exit 0
          fi
          if [ "$DIAGNOSE_JANUARY_PAIR" = "true" ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$EXPECTED_PENDING_JSON" = '[]'
            test "$DIAGNOSE_INTELLIGENCE_DEV" != "true"
            test "$DIAGNOSE_CLIMATE_VIEWS" != "true"
            test "$DIAGNOSE_CLIMATE_DEV" != "true"
            test "$DIAGNOSE_V103_STATE" != "true"
            test "$DIAGNOSE_LEGACY_DEV_RECONCILIATIONS" != "true"
            test -z "$DIAGNOSE_QUERY_ID"
            [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
            test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
            passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
            test "$passed_checks" -gt 0
            test "$SNOWFLAKE_USER" = OH_LYME_DEV_MIGRATION_DEPLOY_SVC
            test "$SNOWFLAKE_ROLE" = OH_LYME_DEV_MIGRATION_DEPLOYER
            test "$SNOWFLAKE_DATABASE" = ONE_HEALTH_LYME_GAP_ATLAS_DEV
            test "$SNOWFLAKE_WAREHOUSE" = OH_LYME_DEV_INGEST_XS_WH
            test "$RUNTIME_USER" = OH_LYME_DEV_PIPELINE_SVC
            test "$RUNTIME_ROLE" = OH_LYME_DEV_RUNTIME
            test -n "$RUNTIME_PRIVATE_KEY_B64"
            test -n "$RUNTIME_PRIVATE_KEY_PASSPHRASE"
            test -n "$JANUARY_DIAGNOSTIC_BUDGET_EVIDENCE"
            umask 077
            private_parent="$GITHUB_WORKSPACE/docs/contracts/climate/reviewed-donors"
            mkdir -p "$private_parent"
            job_dir="$(mktemp -d "$private_parent/.job-XXXXXXXX")"
            chmod 700 "$job_dir"
            runtime_key_file="$job_dir/runtime-key.p8"
            cleanup() { rm -f "$key_file" "$config_file"; rm -rf -- "$job_dir"; rmdir "$private_parent" 2>/dev/null || true; }
            trap cleanup EXIT
            export JANUARY_DIAGNOSTIC_JOB_STARTED_UNIX="$(date +%s)"
            export RUNNER_TEMP="$job_dir"
            export SNOWFLAKE_AUTH_METHOD=key_pair
            export SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")"
            if ! env -u RUNTIME_USER -u RUNTIME_ROLE -u RUNTIME_PRIVATE_KEY_B64 -u RUNTIME_PRIVATE_KEY_PASSPHRASE \
              uv run python scripts/verify_january_donor_dev.py; then
              jq -c '{status, failure, code_sha}' "$job_dir/january-donor-diagnostic-receipt.json" || true
              exit 2
            fi
            donor="$job_dir/january-reviewed-donor.json"
            donor_sha="$(sha256sum "$donor" | cut -d' ' -f1)"
            jq -e --arg sha "$donor_sha" --arg code "$GITHUB_SHA" \
              '.status == "READ_ONLY_DONOR_EXPORT_SUCCEEDED" and .code_sha == $code and .donor.artifact_sha256 == $sha' \
              "$job_dir/january-donor-diagnostic-receipt.json" >/dev/null
            manifest_sha="$(jq -S -c '.annual_manifest' "$donor" | sha256sum | cut -d' ' -f1)"
            rm -f "$key_file"
            {
              printf '%s%s\n' '-----BEGIN ENCRYPTED ' 'PRIVATE KEY-----'
              printf '%s\n' "$RUNTIME_PRIVATE_KEY_B64" | fold -w 64
              printf '%s%s\n' '-----END ENCRYPTED ' 'PRIVATE KEY-----'
            } > "$runtime_key_file"
            runtime_key="$(base64 --wrap=0 "$runtime_key_file")"
            if ! SNOWFLAKE_USER="$RUNTIME_USER" SNOWFLAKE_ROLE="$RUNTIME_ROLE" \
              SNOWFLAKE_PRIVATE_KEY_B64="$runtime_key" \
              SNOWFLAKE_PRIVATE_KEY_PASSPHRASE="$RUNTIME_PRIVATE_KEY_PASSPHRASE" \
              JANUARY_DONOR_HANDOFF_PATH="$donor" JANUARY_DONOR_HANDOFF_SHA256="$donor_sha" \
              env -u RUNTIME_USER -u RUNTIME_ROLE -u RUNTIME_PRIVATE_KEY_B64 -u RUNTIME_PRIVATE_KEY_PASSPHRASE \
                uv run atlas-data source nclimgrid-pilot-measure --action frozen-membership \
                --run-id c2eb2146-005d-44d2-bac4-e2805ca42577; then
              jq -e -c 'select(.status == "BLOCKED" and .failure != null) | {status, failure, code_sha}' "$job_dir/january-membership-diagnostic-receipt.json" || \
                printf '{"status":"BLOCKED","failure":{"category":"REDACTED_RECEIPT_UNAVAILABLE"},"code_sha":"%s"}\n' "$GITHUB_SHA"
              exit 2
            fi
            if ! jq -e --arg sha "$donor_sha" --arg code "$GITHUB_SHA" \
              '.status == "READ_ONLY_EXPORT_SUCCEEDED" and .code_sha == $code and .reviewed_donor_handoff_sha256 == $sha and .membership.row_count == 389856' \
              "$job_dir/january-membership-diagnostic-receipt.json" >/dev/null; then
              jq -e -c 'select(.status == "BLOCKED" and .failure != null) | {status, failure, code_sha}' "$job_dir/january-membership-diagnostic-receipt.json" || \
                printf '{"status":"BLOCKED","failure":{"category":"REDACTED_RECEIPT_UNAVAILABLE"},"code_sha":"%s"}\n' "$GITHUB_SHA"
              exit 2
            fi
            membership_sha="$(sha256sum "$job_dir/source-pilot-inspection-artifact.json" | cut -d' ' -f1)"
            jq -e --arg sha "$membership_sha" \
              '.membership.artifact_sha256 == $sha' \
              "$job_dir/january-membership-diagnostic-receipt.json" >/dev/null
            jq -c '{status,code_sha,account_binding,warehouse_cost_observation,edition_cost_capabilities,pair_forecast_reserved_usd,aggregate_forecast_ceiling_usd,query_ids,close_state,donor}' \
              "$job_dir/january-donor-diagnostic-receipt.json"
            jq -c '{status,code_sha,donor_bundle_sha256,reviewed_donor_handoff_sha256,membership,effective_context,donor_account_binding,warehouse_cost_observation,edition_cost_capabilities,aggregate_forecast_ceiling_usd,query_ids,usage_rows,usage_state,close_state}' \
              "$job_dir/january-membership-diagnostic-receipt.json"
            jq -c '{release_id,bundle_sha256,producer_code_sha}' "$donor"
            printf '{"annual_manifest_sha256":"%s","membership_artifact_sha256":"%s"}\n' "$manifest_sha" "$membership_sha"
            exit 0
          fi
          if [ "$DIAGNOSE_LEGACY_DEV_RECONCILIATIONS" = "true" ]; then
            if [ "$DIAGNOSE_JANUARY_PAIR" = "true" ] || [ "$DIAGNOSE_INTELLIGENCE_DEV" = "true" ] || [ "$DIAGNOSE_CLIMATE_VIEWS" = "true" ] || [ "$DIAGNOSE_CLIMATE_DEV" = "true" ] || [ "$DIAGNOSE_V103_STATE" = "true" ] || [ -n "$DIAGNOSE_QUERY_ID" ] || [ -n "$EXPECTED_PENDING_JSON" ]; then
              echo 'Choose only the fixed reconciliation diagnostic, without a pending migration set.' >&2
              exit 2
            fi
            timeout 120s uv run python scripts/diagnose_dev_migration_reconciliations.py --config-file "$config_file"
            exit 0
          fi
          if [ "$DIAGNOSE_INTELLIGENCE_DEV" = "true" ]; then
            if [ "$DIAGNOSE_CLIMATE_VIEWS" = "true" ] || [ "$DIAGNOSE_CLIMATE_DEV" = "true" ] || [ "$DIAGNOSE_V103_STATE" = "true" ] || [ -n "$DIAGNOSE_QUERY_ID" ] || { [ -n "$EXPECTED_PENDING_JSON" ] && [ "$EXPECTED_PENDING_JSON" != '[]' ]; }; then
              echo 'Choose intelligence read-only mode without migrations or another diagnostic.' >&2
              exit 2
            fi
            SNOWFLAKE_AUTH_METHOD=key_pair \
            SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
            uv run python scripts/verify_intelligence_dev_preflight.py
            exit 0
          fi
          # Detect the one exact reviewed feed batch locally, before any SQL.
          feed_batch="$(uv run python - <<'PY'
          import os
          from lyme_gap_atlas_data.migrations import (
              is_intelligence_prerequisite_batch,
              parse_reviewed_pending_set,
          )
          raw = os.environ.get("EXPECTED_PENDING_JSON", "")
          reviewed = parse_reviewed_pending_set(raw) if raw else []
          selected = is_intelligence_prerequisite_batch(reviewed)
          print("true" if selected else "false")
          PY
          )"
          if [ "$feed_batch" = "true" ]; then
            test "$FEED_PREFLIGHT_ACCOUNTING_CONFIRMED" = "true"
            test "$DIAGNOSE_CLIMATE_VIEWS" != "true"
            test "$DIAGNOSE_CLIMATE_DEV" != "true"
            test "$DIAGNOSE_V103_STATE" != "true"
            test -z "$DIAGNOSE_QUERY_ID"
            SNOWFLAKE_AUTH_METHOD=key_pair \
            SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
            uv run atlas-data pipeline apply-reviewed-dev-migrations \
              --expected-pending-json "$EXPECTED_PENDING_JSON" \
              --database "$SNOWFLAKE_DATABASE" --commit "$GITHUB_SHA" \
              --feed-preflight-accounting-confirmed --confirm
            exit 0
          fi
          if [ "$DIAGNOSE_CLIMATE_VIEWS" = "true" ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$EXPECTED_PENDING_JSON" = '[]'
            test "$DIAGNOSE_CLIMATE_DEV" != "true"
            test "$DIAGNOSE_V103_STATE" != "true"
            test "$DIAGNOSE_INTELLIGENCE_DEV" != "true"
            test "$DIAGNOSE_JANUARY_PAIR" != "true"
            test "$DIAGNOSE_JANUARY_RUNTIME_INIT" != "true"
            test "$DIAGNOSE_LEGACY_DEV_RECONCILIATIONS" != "true"
            test "$DIAGNOSE_V143_CLEANUP_OWNER" != "true"
            test "$REGISTER_EID_EXPEDITED_DEV" != "true"
            test "$FEED_PREFLIGHT_ACCOUNTING_CONFIRMED" != "true"
            test -z "$DIAGNOSE_QUERY_ID"
            test -z "$JANUARY_DIAGNOSTIC_BUDGET_EVIDENCE"
            [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
            test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
            passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
            test "$passed_checks" -gt 0
            # The script validates identity inside its bounded connection. Do not
            # run an unbounded CLI identity query before the process deadline.
            SNOWFLAKE_AUTH_METHOD=key_pair \
            SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
            MAX_CON_RETRY_ATTEMPTS=0 \
            timeout --signal=INT --kill-after=15s 300s uv run python scripts/verify_climate_dev_views.py
            exit 0
          fi
          # Bound only the exact January view migration; unrelated migrations
          # continue through their existing reviewed deployment path.
          climate_v147_batch="$(uv run python - <<'PY'
          import os
          from lyme_gap_atlas_data.migrations import parse_reviewed_pending_set
          raw = os.environ.get("EXPECTED_PENDING_JSON", "")
          expected = [{"version": "V147", "filename": "V147__dev_climate_scalar_membership_join.sql", "sha256": "22caabb8abb205316005d866286d7adb995a0b7dc5ec8b05aa6c6f053dfca83b"}]
          print("true" if raw and parse_reviewed_pending_set(raw) == expected else "false")
          PY
          )"
          if [ "$climate_v147_batch" = "true" ]; then
            test "$GITHUB_REF" = refs/heads/main
            [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
            test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
            for other_mode in "$REGISTER_EID_EXPEDITED_DEV" "$DIAGNOSE_V143_CLEANUP_OWNER" \
              "$DIAGNOSE_JANUARY_PAIR" "$DIAGNOSE_JANUARY_RUNTIME_INIT" \
              "$DIAGNOSE_LEGACY_DEV_RECONCILIATIONS" "$DIAGNOSE_INTELLIGENCE_DEV" \
              "$DIAGNOSE_CLIMATE_DEV" "$DIAGNOSE_V103_STATE" "$DIAGNOSE_CLIMATE_VIEWS"; do
              test "$other_mode" != "true"
            done
            test -z "$DIAGNOSE_QUERY_ID"
            test -z "$JANUARY_DIAGNOSTIC_BUDGET_EVIDENCE"
            test "$FEED_PREFLIGHT_ACCOUNTING_CONFIRMED" != "true"
            passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_COMMIT/check-runs" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
            test "$passed_checks" -gt 0
            SNOWFLAKE_AUTH_METHOD=key_pair \
            SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
            MAX_CON_RETRY_ATTEMPTS=0 ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS=60 \
            timeout --signal=INT --kill-after=15s 180s uv run python - <<'PY'
          import os
          import runpy
          from lyme_gap_atlas_data.cli import apply_reviewed_dev_migrations_command
          from lyme_gap_atlas_data.climate_dev_validation import DEV, ROLE, USER, WAREHOUSE
          bounded_connection = runpy.run_path("scripts/verify_climate_dev_views.py")["bounded_connection"]
          with bounded_connection() as connection, connection.cursor() as cursor:
              cursor.execute("SELECT CURRENT_USER(),CURRENT_ROLE(),CURRENT_DATABASE(),CURRENT_WAREHOUSE()")
              if cursor.fetchone() != (USER, ROLE, DEV, WAREHOUSE):
                  raise SystemExit("CLIMATE_MIGRATION_IDENTITY")
          apply_reviewed_dev_migrations_command(
              database=DEV, expected_pending_json=os.environ["EXPECTED_PENDING_JSON"],
              commit=os.environ["GITHUB_SHA"], confirm=True,
              feed_preflight_accounting_confirmed=False,
          )
          PY
            exit 0
          fi
          snow --config-file "$config_file" sql -c oh_lyme_dev \
            -q "SELECT CURRENT_ACCOUNT(), CURRENT_USER(), CURRENT_ROLE(), CURRENT_DATABASE(), CURRENT_WAREHOUSE()" --format JSON
          if [ "$DIAGNOSE_CLIMATE_DEV" = "true" ]; then
            if [ "$DIAGNOSE_V103_STATE" = "true" ] || [ -n "$DIAGNOSE_QUERY_ID" ]; then
              echo 'Choose one diagnostic mode.' >&2
              exit 2
            fi
            SNOWFLAKE_AUTH_METHOD=key_pair \
            SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
            uv run python scripts/verify_climate_dev.py
            exit 0
          fi
          if [ "$DIAGNOSE_V103_STATE" = "true" ]; then
            if [ -n "$DIAGNOSE_QUERY_ID" ]; then
              echo 'Choose one diagnostic mode.' >&2
              exit 2
            fi
            uv run python scripts/diagnose_v103_dev.py --config-file "$config_file"
            exit 0
          fi
          if [ -n "$DIAGNOSE_QUERY_ID" ]; then
            [[ "$DIAGNOSE_QUERY_ID" =~ ^[0-9a-f-]{36}$ ]]
            snow --config-file "$config_file" sql -c oh_lyme_dev \
              -q "SELECT QUERY_ID, REGEXP_SUBSTR(UPPER(QUERY_TEXT), '(CREATE|ALTER|GRANT|REVOKE|USE)') AS STATEMENT_KIND, ERROR_CODE, REGEXP_REPLACE(ERROR_MESSAGE, '(?i)(password|secret|token|private[[:space:]_-]*key)[^[:space:],;]*', '[REDACTED]') AS REDACTED_ERROR_MESSAGE, ROLE_NAME FROM TABLE(INFORMATION_SCHEMA.QUERY_HISTORY_BY_USER(RESULT_LIMIT=>10000)) WHERE QUERY_ID='$DIAGNOSE_QUERY_ID' AND REGEXP_LIKE(UPPER(QUERY_TEXT), '(CREATE|ALTER|GRANT|REVOKE|USE)[[:space:]]+')" --format JSON
            exit 0
          fi
          # Migration versions, filenames, checksums, and timestamps are deployment
          # metadata. Emit them before a guarded apply so a mismatch is diagnosable
          # without revealing credentials, payloads, or connection configuration.
          snow --config-file "$config_file" sql -c oh_lyme_dev \
            -q "SELECT version, filename, sha256, applied_at FROM GOVERNANCE.SCHEMA_MIGRATIONS ORDER BY version" --format JSON
          SNOWFLAKE_AUTH_METHOD=key_pair \
          SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE="$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" \
          uv run atlas-data pipeline apply-reviewed-dev-migrations \
            --expected-pending-json "$EXPECTED_PENDING_JSON" \
            --database "$SNOWFLAKE_DATABASE" --commit "$GITHUB_SHA" --confirm
        env:
          METADATA_PREFLIGHT_ONLY: ${{ inputs.metadata_preflight_only }}
          LEDGER_DIAGNOSTIC_ONLY: ${{ inputs.ledger_diagnostic_only }}
          EXPECTED_PENDING_JSON: ${{ inputs.expected_pending_json }}
          DIAGNOSE_INTELLIGENCE_DEV: ${{ inputs.diagnose_intelligence_dev }}
          REGISTER_EID_EXPEDITED_DEV: ${{ inputs.register_eid_expedited_dev }}
          FEED_PREFLIGHT_ACCOUNTING_CONFIRMED: ${{ inputs.feed_preflight_accounting_confirmed }}
          DIAGNOSE_QUERY_ID: ${{ inputs.diagnose_query_id }}
          DIAGNOSE_V103_STATE: ${{ inputs.diagnose_v103_state }}
          DIAGNOSE_LEGACY_DEV_RECONCILIATIONS: ${{ inputs.diagnose_legacy_dev_reconciliations }}
          DIAGNOSE_V143_CLEANUP_OWNER: ${{ inputs.diagnose_v143_cleanup_owner }}
          DIAGNOSE_CLIMATE_DEV: ${{ inputs.diagnose_climate_dev }}
          DIAGNOSE_CLIMATE_VIEWS: ${{ inputs.diagnose_climate_views }}
          DIAGNOSE_JANUARY_PAIR: ${{ inputs.diagnose_january_pair }}
          DIAGNOSE_JANUARY_RUNTIME_INIT: ${{ inputs.diagnose_january_runtime_init }}
          JANUARY_DIAGNOSTIC_BUDGET_EVIDENCE: ${{ inputs.january_budget_evidence }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          RUNTIME_USER: ${{ secrets.SNOWFLAKE_RUNTIME_USER }}
          RUNTIME_ROLE: ${{ secrets.SNOWFLAKE_RUNTIME_ROLE }}
          RUNTIME_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_RUNTIME_PRIVATE_KEY_B64 }}
          RUNTIME_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_RUNTIME_PRIVATE_KEY_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}


  release-integrity-prepare:
    if: inputs.release_integrity_fixture == true || inputs.ri706_recovery_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
    env:
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      RI706_EXPECTED_ARTIFACTS: ${{ inputs.ri706_expected_artifacts }}
      RI706_DISPATCH_INPUTS: ${{ toJSON(inputs) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra pipeline
      - name: Prepare exact-source expiring owner authorization without deployment credentials
        run: uv run python scripts/review_release_integrity_fixture_gate.py --prepare

  release-integrity-owner-authorization:
    if: inputs.release_integrity_fixture == true
    needs: release-integrity-prepare
    environment: ri706-dev-fixture
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
    env:
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      RI706_EXPECTED_ARTIFACTS: ${{ inputs.ri706_expected_artifacts }}
      RI706_DISPATCH_INPUTS: ${{ toJSON(inputs) }}
      RI706_REVIEW_RECEIPT: ${{ github.workspace }}/ri706-review.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra pipeline
      - name: Verify native CarawayLabs deployment authorization without Snowflake credentials
        run: uv run python scripts/review_release_integrity_fixture_gate.py

  release-integrity-fixture:
    if: inputs.release_integrity_fixture == true
    needs: release-integrity-owner-authorization
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: ri706-dev-fixture
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
    env:
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      RI706_EXPECTED_ARTIFACTS: ${{ inputs.ri706_expected_artifacts }}
      RI706_DISPATCH_INPUTS: ${{ toJSON(inputs) }}
      RI706_REVIEW_RECEIPT: ${{ github.workspace }}/ri706-review.json
      IMAGE: registry.digitalocean.com/oh-lyme-data/pipeline
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Verify exact-run owner authorization before building the fixture image
        run: uv run python scripts/review_release_integrity_fixture_gate.py
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: "1.160.1"
      - name: Build or reuse immutable reviewed fixture image
        id: fixture_image
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          doctl registry login --expiry-seconds 1200
          tag="ri706-${REVIEWED_COMMIT}"
          digest="$(doctl registry repository list-manifests pipeline --output json | jq -r --arg tag "$tag" '[.[] | select((.tags // []) | index($tag)) | .digest] | if length == 1 then .[0] else empty end')"
          if [ -z "$digest" ]; then
            docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$REVIEWED_COMMIT" -t "$IMAGE:$tag" .
            docker push "$IMAGE:$tag"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$tag" | cut -d@ -f2)"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$digest"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$digest")" = "$REVIEWED_COMMIT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Replay exact public ML138 handoff without refitting
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Caraway-Labs/one-health-lyme-gap-atlas-machine-learning.git "$RUNNER_TEMP/ri706-handoff"
          git -C "$RUNNER_TEMP/ri706-handoff" checkout --detach c186e0bdc9ee096a15284bc848de034981fe634b
          test "$(git -C "$RUNNER_TEMP/ri706-handoff" rev-parse HEAD)" = c186e0bdc9ee096a15284bc848de034981fe634b
          uv run --project "$RUNNER_TEMP/ri706-handoff" python "$RUNNER_TEMP/ri706-handoff/scripts/assemble_138_surveillance_situation_batch.py"
          # Restore the exact frozen metadata bytes, including approved CRLF.
          # No --write-committed, inference, source reconstruction or model refresh.
          cp docs/contracts/surveillance-situations/138-surveillance-situation-*.json "$RUNNER_TEMP/ri706-handoff/config/models/"
      - name: Recheck owner authorization expiry and binding before privileged execution
        run: uv run python scripts/review_release_integrity_fixture_gate.py
      - name: Execute fixed-schema partial recovery and acceptance in the pinned image
        timeout-minutes: 20
        env:
          RI706_IMAGE_DIGEST: ${{ steps.fixture_image.outputs.digest }}
          RI706_FIXTURE_MODE: 'true'
          RI706_RECOVERY_RUN_ID: ${{ inputs.ri706_recovery_run_id }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_AUTH_METHOD: key_pair
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          RI706_OWNER_USER: ${{ vars.RI706_OWNER_USER }}
          RI706_OWNER_PRIVATE_KEY_B64: ${{ secrets.RI706_OWNER_PRIVATE_KEY_B64 }}
          RI706_OWNER_PRIVATE_KEY_PASSPHRASE: ${{ secrets.RI706_OWNER_PRIVATE_KEY_PASSPHRASE }}
          RI706_PUBLISHER_USER: ${{ vars.RI706_PUBLISHER_USER }}
          RI706_PUBLISHER_PRIVATE_KEY_B64: ${{ secrets.RI706_PUBLISHER_PRIVATE_KEY_B64 }}
          RI706_PUBLISHER_PRIVATE_KEY_PASSPHRASE: ${{ secrets.RI706_PUBLISHER_PRIVATE_KEY_PASSPHRASE }}
          RI706_READER_USER: ${{ vars.RI706_READER_USER }}
          RI706_READER_PRIVATE_KEY_B64: ${{ secrets.RI706_READER_PRIVATE_KEY_B64 }}
          RI706_READER_PRIVATE_KEY_PASSPHRASE: ${{ secrets.RI706_READER_PRIVATE_KEY_PASSPHRASE }}
          RI706_RUNTIME_USER: ${{ secrets.SNOWFLAKE_RUNTIME_USER }}
          RI706_RUNTIME_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_RUNTIME_PRIVATE_KEY_B64 }}
          RI706_RUNTIME_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_RUNTIME_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          # All role credentials must be provisioned before any fixture DDL.
          for name in RI706_EXPECTED_ARTIFACTS RI706_OWNER_USER RI706_OWNER_PRIVATE_KEY_B64 RI706_PUBLISHER_USER RI706_PUBLISHER_PRIVATE_KEY_B64 RI706_READER_USER RI706_READER_PRIVATE_KEY_B64 RI706_RUNTIME_USER RI706_RUNTIME_PRIVATE_KEY_B64; do
            test -n "${!name}"
          done
          mkdir -p "$RUNNER_TEMP/ri706-receipts"
          # Existing secret stores the encrypted PEM body. Convert process-locally.
          pem="$RUNNER_TEMP/ri706-key.p8"
          trap 'rm -f "$pem"' EXIT
          { printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'; printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64; printf '\n%s\n' '-----END ENCRYPTED PRIVATE KEY-----'; } > "$pem"
          export SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$pem")"
          { printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'; printf '%s' "$RI706_RUNTIME_PRIVATE_KEY_B64" | fold -w 64; printf '\n%s\n' '-----END ENCRYPTED PRIVATE KEY-----'; } > "$pem"
          export RI706_RUNTIME_PRIVATE_KEY_B64="$(base64 --wrap=0 "$pem")"
          export ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS=60
          args=()
          for name in GITHUB_ACTIONS GITHUB_REPOSITORY GITHUB_SHA REVIEWED_COMMIT RI706_IMAGE_DIGEST RI706_FIXTURE_MODE RI706_EXPECTED_ARTIFACTS SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_ROLE SNOWFLAKE_DATABASE SNOWFLAKE_WAREHOUSE SNOWFLAKE_AUTH_METHOD SNOWFLAKE_PRIVATE_KEY_B64 SNOWFLAKE_PRIVATE_KEY_PASSPHRASE ATLAS_SQL_STATEMENT_TIMEOUT_SECONDS RI706_OWNER_USER RI706_OWNER_PRIVATE_KEY_B64 RI706_OWNER_PRIVATE_KEY_PASSPHRASE RI706_PUBLISHER_USER RI706_PUBLISHER_PRIVATE_KEY_B64 RI706_PUBLISHER_PRIVATE_KEY_PASSPHRASE RI706_READER_USER RI706_READER_PRIVATE_KEY_B64 RI706_READER_PRIVATE_KEY_PASSPHRASE RI706_RUNTIME_USER RI706_RUNTIME_PRIVATE_KEY_B64 RI706_RUNTIME_PRIVATE_KEY_PASSPHRASE; do
            args+=(--env "$name")
          done
          args+=(--env RI706_REVIEW_RECEIPT=/review.json -v "$RI706_REVIEW_RECEIPT:/review.json:ro" -v "$RUNNER_TEMP/ri706-handoff:/handoff:ro" -v "$RUNNER_TEMP/ri706-receipts:/receipts")
          if [[ -z "$RI706_RECOVERY_RUN_ID" ]]; then
            set +e
            docker run --rm "${args[@]}" "$IMAGE@$RI706_IMAGE_DIGEST" /app/.venv/bin/python /app/scripts/run_release_integrity_fixture.py --handoff /handoff --receipt /receipts/partial-install.json --install-only --stop-after-v157
            partial_status=$?
            set -e
            test "$partial_status" = 0 -o "$partial_status" = 75
          fi
          docker run --rm "${args[@]}" "$IMAGE@$RI706_IMAGE_DIGEST" /app/.venv/bin/python /app/scripts/run_release_integrity_fixture.py --handoff /handoff --receipt /receipts/acceptance.json
      - name: Retain redacted fixture execution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri706-dev-fixture-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.RI706_REVIEW_RECEIPT }}
            ${{ runner.temp }}/ri706-receipts/*.json
          if-no-files-found: ignore
          retention-days: 30
