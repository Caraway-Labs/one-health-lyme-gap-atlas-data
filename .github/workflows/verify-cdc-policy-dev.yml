name: Verify CDC operating policy with isolated DEV fixtures
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: dev-cdc-policy-fixtures
  cancel-in-progress: false
jobs:
  verify:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra pipeline
      - run: uv run pytest -q
      - name: Execute actual publication and quality functions using temporary tables
        run: uv run python scripts/verify_cdc_policy_dev.py
        env:
          SNOWFLAKE_AUTH_METHOD: key_pair
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: OH_LYME_DEV_PIPELINE_RUNTIME
          SNOWFLAKE_WAREHOUSE: OH_LYME_DEV_INGEST_XS_WH
          SNOWFLAKE_DATABASE: ONE_HEALTH_LYME_GAP_ATLAS_DEV
          CI_SNOWFLAKE_KEY_BODY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
