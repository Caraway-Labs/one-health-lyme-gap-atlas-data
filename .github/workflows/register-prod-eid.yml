name: Register reviewed CDC EID source in PROD

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: One exact reviewed CDC metadata source; no other source admission
        required: true
        type: choice
        default: cdc-eid-expedited
        options:
          - cdc-eid-expedited
          - cdc-eid-ahead-of-print
          - cdc-outbreaks
          - nih-news-releases
          - cdc-mmwr
          - pubmed-tick-borne
          - pubmed-lyme-borrelia
      reviewed_commit:
        description: Exact green main commit approved for PROD source registration
        required: true
        type: string
      registry_version:
        description: Exact reviewed immutable source version; v2 enables approved daily execution
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
      expected_pending_json:
        description: Must be the empty migration set
        required: true
        type: string
      accounting_confirmed:
        description: Explicit confirmation of this single bounded PROD registry write
        required: true
        type: boolean

permissions:
  contents: read
  checks: read

concurrency:
  group: prod-eid-source-registration
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      TOPX_ENV: prod
      ENABLE_PRODUCTION_EXECUTION: "true"
      INTELLIGENCE_SOURCE_ID: ${{ inputs.source_id }}
      INTELLIGENCE_SOURCE_REGISTRY_VERSION: ${{ inputs.registry_version }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate expected_pending_json
        id: expected_pending
        env:
          EXPECTED_PENDING_JSON: ${{ inputs.expected_pending_json }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_PENDING_JSON}" ]; then
            printf 'normalized=\n' >> "$GITHUB_OUTPUT"
          else
            normalized="$(bash scripts/validate_expected_pending_json.sh)"
            printf 'normalized=%s\n' "$normalized" >> "$GITHUB_OUTPUT"
          fi
      - name: Require exact green main and reviewed empty migration set
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          EXPECTED_PENDING_JSON: ${{ steps.expected_pending.outputs.normalized }}
          ACCOUNTING_CONFIRMED: ${{ inputs.accounting_confirmed }}
        run: |
          set -euo pipefail
          source scripts/ci/guard.sh
          guard_eq github_ref refs/heads/main "$GITHUB_REF" "Dispatch this workflow from main. Protected promotion does not run from another ref."
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          guard_eq github_sha "$REVIEWED_COMMIT" "$GITHUB_SHA" "Dispatch from main at the reviewed commit, or update REVIEWED_COMMIT to the commit you reviewed."
          guard_eq expected_pending_json '[]' "$EXPECTED_PENDING_JSON" "Registering an EID source requires expected_pending_json=[]. Redispatch with the reviewed empty array."
          guard_true accounting_confirmed "$ACCOUNTING_CONFIRMED" "accounting_confirmed must be true for this single registry write. Redispatch with accounting_confirmed=true after confirming the bounded write."
          passed_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "checks" and .conclusion == "success")] | length')"
          guard_gt quality_checks 0 "$passed_checks" "No successful Quality run was found for this commit. Wait for Quality to pass on main before dispatching."
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra pipeline
      - name: Register only the reviewed EID version 1 under PROD migration owner
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/oh-lyme-prod-eid-key.p8"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          {
            printf '%s\n' '-----BEGIN ENCRYPTED PRIVATE KEY-----'
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY_B64" | fold -w 64
            printf '%s\n' '-----END ENCRYPTED PRIVATE KEY-----'
          } > "$key_file"
          SNOWFLAKE_AUTH_METHOD=key_pair \
          SNOWFLAKE_PRIVATE_KEY_B64="$(base64 --wrap=0 "$key_file")" \
          uv run python scripts/register_eid_expedited_prod.py
