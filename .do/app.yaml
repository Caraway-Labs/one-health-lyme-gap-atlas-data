name: one-health-lyme-gap-atlas-data-dev
region: sfo
jobs:
  - name: catalog-ingestion
    kind: SCHEDULED
    schedule:
      cron: "0 8 * * 1"
      time_zone: America/Denver
    github:
      repo: Caraway-Labs/one-health-lyme-gap-atlas-data
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: uv run atlas-data pipeline discover
    envs:
      - key: TOPX_ENV
        value: dev
      - key: SNOWFLAKE_DATABASE
        value: ONE_HEALTH_LYME_GAP_ATLAS_DEV
      - key: SNOWFLAKE_ROLE
        value: OH_LYME_DEV_PIPELINE_RUNTIME
      - key: SNOWFLAKE_WAREHOUSE
        value: OH_LYME_DEV_INGEST_XS_WH
      - key: SNOWFLAKE_AUTH_METHOD
        value: key_pair
      - key: SNOWFLAKE_ACCOUNT
        scope: RUN_TIME
        type: SECRET
      - key: SNOWFLAKE_USER
        scope: RUN_TIME
        type: SECRET
      - key: SNOWFLAKE_PRIVATE_KEY_B64
        scope: RUN_TIME
        type: SECRET
      - key: SNOWFLAKE_PRIVATE_KEY_PASSPHRASE
        scope: RUN_TIME
        type: SECRET
      - key: DATA_GOV_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SOCRATA_APP_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_REGION
        value: sfo3
      - key: SPACES_ENDPOINT
        value: https://sfo3.digitaloceanspaces.com
      - key: SPACES_BUCKET
        value: one-health-lyme-gap-atlas-data-dev
      - key: SPACES_PREFIX
        value: dev
      - key: SPACES_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
