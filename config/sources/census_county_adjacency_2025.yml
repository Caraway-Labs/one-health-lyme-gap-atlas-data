restrictions:
  - Vintage 2025 is pinned to sha256 8233d2aed342f62eb02bae9f9002ad1d8fc6bd82d739185eba8bad832bf8fc87. A publisher revision is a new reviewed release.
  - Adjacent means a shared edge or a point contact, including boundaries in water, as defined by the Census Bureau. Length 0 is point contact.
  - Pairs are undirected. FIPS_A is less than FIPS_B. Counties are not adjacent to themselves.
  - Puerto Rico and island areas (state FIPS 60, 66, 69, 72, and 78) stay in the raw landing table and are excluded from the governed pairs.
  - The three Hawaii counties with no neighbor are reported as islands and are not stored as fake pairs.
  - Join on the five-character FIPS only. County names are not join keys.
  - Connecticut uses the nine 2025 planning regions. Legacy Connecticut counties are out of scope.
  - This table has no geometry.
