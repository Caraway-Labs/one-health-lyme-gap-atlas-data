  - Borrelia_mayonii_Data_Source
  - Borrelia_miyamotoi_County_Status
  - Borrelia_miyamotoi_Data_Source
  - Anaplasma_phagocytophilum_human_active_variant_County_Status
  - Anaplasma_phagocytophilum_human_active_variant_Data_Source
  - Ehrlichia_muris_eauclairensis_County_Status
  - Ehrlichia_muris_eauclairensis_Data_Source
  - Babesia_microti_County_Status
  - Babesia_microti_Data_Source
  - Powassan_virus_County_Status
  - Powassan_virus_Data_Source
allowed_status_values: [Present, No records]
pathogen_status_columns:
  Borrelia_burgdorferi_sensu_stricto_County_Status: Borrelia burgdorferi sensu stricto
  Borrelia_mayonii_County_Status: Borrelia mayonii
  Borrelia_miyamotoi_County_Status: Borrelia miyamotoi
  Anaplasma_phagocytophilum_human_active_variant_County_Status: Anaplasma phagocytophilum human-active variant
  Ehrlichia_muris_eauclairensis_County_Status: Ehrlichia muris eauclairensis
  Babesia_microti_County_Status: Babesia microti
  Powassan_virus_County_Status: Powassan virus
restrictions:
  - This is a Tier D requestor-restricted ArboNET source. Raw workbook bytes remain private and are never exposed through Git, workflow artifacts, logs, Streamlit, APIs, or public web pages.
  - No records means no documented published county record. It is not pathogen absence, a negative test, prevalence, human infection incidence, individual risk, or diagnosis.
  - The source is cumulative through the stated as-of date for pathogens identified in host-seeking Ixodes scapularis or Ixodes pacificus ticks.
  - This source supplies no tested-tick count, positive-tick count, sampling effort, or laboratory-method detail and must use PATHOGEN_PRESENCE_STATUS, never PATHOGEN_TESTING.
  - Release provenance must cite the CDC Tick Surveillance Data Sets page and the CDC ArboNET Tick Module. A final copy of resulting publications or presentations must be provided to CDC Division of Vector-Borne Diseases.
