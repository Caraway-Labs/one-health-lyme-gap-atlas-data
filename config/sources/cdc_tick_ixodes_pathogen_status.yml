profile_version: 1
platform_type: HTTP_XLSX
connector_name: HTTP_XLSX_V1
landing_page_url: https://www.cdc.gov/ticks/data-research/facts-stats/tick-surveillance-data-sets.html
source_description_url: https://www.cdc.gov/ticks/data-research/facts-stats/tickborne-pathogen-surveillance-1.html
endpoint_template: https://www.cdc.gov/ticks/media/files/2026/04/Public_Use_Ixodes_Pathogens_County_Table_2026_04292026.xlsx
workbook_sheet: Ixodes Pathogens 2025
header_row: 2
deterministic_order_clause: FIPS_Code ASC
incremental_strategy: SNAPSHOT_DIFF
onboarding_environments: [dev, prod]
onboarding_mode: EVIDENCE_ONLY
sample_limit: 25
maximum_sample_limit: 100
maximum_workbook_bytes: 1048576
maximum_uncompressed_bytes: 10485760
dataset_as_of: 2025-12-31
geography_semantics: COUNTY_PATHOGEN_STATUS
temporal_semantics: CUMULATIVE_STATUS_THROUGH_DATE
required_columns:
  - FIPS_Code
  - State
  - County
  - Borrelia_burgdorferi_sensu_stricto_County_Status
  - Borrelia_burgdorferi_sensu_stricto_Data_Source
