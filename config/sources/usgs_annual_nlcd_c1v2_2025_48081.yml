    severity: BLOCKING
restrictions:
  - Official USGS requester-pays S3 C1V2 CU tile artifacts only; no legacy or mosaic mixing.
  - The frozen 2025 TIGER county geometry is the analysis reference; selected tiles must cover each county.
  - Native class and change codes are categorical; source impervious values are percent and converted explicitly to fraction.
  - Every product must have complete valid area within the observed source-supported footprint; missing pixels block the measure.
  - Alaska and Hawaii are out of source coverage; 1985 native change is retained but not interpreted until its comparison period is verified.
  - No fragmentation, phenology, score, ML feature, PROD publication, or public/API admission.
