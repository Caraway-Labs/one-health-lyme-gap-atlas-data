restrictions:
  - Evidence capture is bounded and environment-isolated; approval never starts acquisition.
  - Preserve the 2008-2021 surveillance era separately from 2022 onward.
  - Reported cases are not infection incidence or county-of-exposure measurements.
  - Preserve zero, null, unknown, suppressed, and not-reported states.
  - Do not infer a unique natural key from demographic dimensions.
  - A bounded sample does not establish complete coverage or full-dataset quality.
