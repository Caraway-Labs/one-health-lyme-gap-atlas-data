[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "one-health-lyme-gap-atlas-data"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
  "neo4j>=6,<7",
  "one-health-lyme-gap-atlas-knowledge-graph @ git+https://github.com/Caraway-Labs/one-health-lyme-gap-atlas-knowledge-graph.git@kg-v1.0.0",
  "one-health-lyme-gap-atlas-shared @ git+https://github.com/Caraway-Labs/one-health-lyme-gap-atlas-shared-python.git@v0.1.6",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
]

[project.scripts]
atlas-data = "lyme_gap_atlas_data.cli:app"

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]
pipeline = ["dbt-snowflake>=1.9,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/lyme_gap_atlas_data"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lyme_gap_atlas_data"]
