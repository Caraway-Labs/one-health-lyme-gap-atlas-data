[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "one-health-lyme-gap-atlas-data"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
  "neo4j>=6,<7",
  "one-health-lyme-gap-atlas-knowledge-graph @ git+https://github.com/Caraway-Labs/one-health-lyme-gap-atlas-knowledge-graph.git@kg-v1.0.0",
  "one-health-lyme-gap-atlas-shared @ git+https://github.com/Caraway-Labs/one-health-lyme-gap-atlas-shared-python.git@v0.1.6",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
  "tzdata>=2025.2,<2027",
  "typer>=0.15,<1",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "pyshp>=2.3,<3",
  "numpy<2.5",
  "h5netcdf>=1.4,<2",
  "h5py>=3.12,<4",
  "rasterio>=1.4,<2",
  "pyhdf>=0.11.7,<0.12",
  "requests>=2.32,<3",
]

[project.scripts]
atlas-data = "lyme_gap_atlas_data.cli:app"

[project.optional-dependencies]
dev = [
    "jsonschema>=4,<5",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "types-shapely>=2.1,<3",
]
pipeline = ["dbt-snowflake>=1.9,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/lyme_gap_atlas_data"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lyme_gap_atlas_data"]
