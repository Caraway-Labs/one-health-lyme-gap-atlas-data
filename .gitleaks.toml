title = "One Health Lyme Gap Atlas data pipeline secret-scanning exceptions"

[[allowlists]]
description = "Public CDC historical resource identifier, not an authentication secret"
condition = "AND"
paths = [
  '''^config/sources/cdc_qtbi_xd4i\.yml$''',
  '''^src/lyme_gap_atlas_data/cdc_historical\.py$''',
  '''^src/lyme_gap_atlas_data/cdc\.py$''',
  '''^migrations/V04[678]__dev_historical_cdc_(storage|explorer|view_ownership)\.sql$''',
  '''^dbt/models/staging/stg_cdc_lyme_qtbi_xd4i\.sql$''',
  '''^streamlit_approval/streamlit_app\.py$''',
  '''^tests/test_cdc_historical\.py$''',
  '''^migrations/V04[45]__dev_historical_cdc_(review|decision)\.sql$''',
  '''^migrations/V0(49__prod_historical_cdc_review|50__prod_historical_cdc_decision)\.sql$''',
  '''^migrations/V05[12]__prod_historical_cdc_(storage|explorer)\.sql$''',
  '''^migrations/V054__dev_tick_surveillance_decision\.sql$''',
  '''^migrations/V086__prod_routine_public_semantic_source_admission\.sql$''',
]
regexTarget = "secret"
regexes = ['''^cdc_lyme_qtbi_xd4i$''']

[[allowlists]]
description = "Reviewed PEM-formatting source code, not a private key; exact introducing commit and script"
condition = "AND"
commits = ["22691520f5cd9cdab3c30374eaff2ae4fd41f1c5"]
paths = ['''^scripts/verify_cdc_policy_dev\.py$''']
regexTarget = "match"
regexes = ['''key_body''']

[extend]
useDefault = true

[[allowlists]]
description = "Literal non-secret configuration keys and CDC resource identifier"
commits = ["f065b11d55a6c03af272451666521c68a779be87"]
regexTarget = "match"
regexes = [
  '''DATA_GOV_API_KEY''',
  '''^resource_key:\s+cdc_lyme_x5j9_wybp$''',
]

[[allowlists]]
description = "Reviewed non-secret CDC resource identifier in its introducing commit"
commits = ["c1be4b6984c90289638a0637fd23becc3d225044"]
regexTarget = "match"
regexes = [
  '''^RESOURCE_KEY = "cdc_lyme_x5j9_wybp"$''',
]

[[allowlists]]
description = "Public CDC resource identifier used by the governed approval migration"
paths = [
  '''^migrations/V016__dev_cdc_source_approval_console_hardening\.sql$''',
]
regexTarget = "match"
regexes = [
  '''.*cdc_lyme_x5j9_wybp.*''',
]

[[allowlists]]
description = "Literal encrypted runtime-secret key names in the production app template"
paths = [
  '''^\.do/app\.prod\.yaml$''',
]
regexTarget = "match"
regexes = [
  '''SNOWFLAKE_PRIVATE_KEY_B64''',
]

[[allowlists]]
description = "Published CDC/ATSDR ArcGIS service identifier, not a credential"
paths = [
  '''^config/sources/cdc_atsdr_svi_2022_county\.yml$''',
]
regexTarget = "match"
regexes = [
  '''ZvidGQkLaDJxRSJ2''',
]

[[allowlists]]
description = "Public governed source identifier in the semantic-release template, not a credential"
paths = [
  '''^docs/contracts/semantic-release/governed-2026-09-15-manifest\.template\.json$''',
]
regexTarget = "match"
regexes = [
  '''^cdc_atsdr_svi_2022_county$''',
]

[[allowlists]]
description = "Public CDC/ATSDR source identifier in the canonical pathogen parity migration, not a credential"
paths = [
  '''^migrations/V085__dev_pathogen_parity_canonical_coverage\.sql$''',
]
regexTarget = "secret"
regexes = [
  '''^cdc_atsdr_svi_2022_county$''',
]

[[allowlists]]
description = "Reviewed immutable source-artifact digests in the governed semantic manifest, not credentials"
paths = [
  '''^docs/contracts/semantic-release/governed-2026-09-15-manifest\.json$''',
]
regexTarget = "secret"
regexes = [
  '''^(c00584e1a940f31369ad130f6e67c8bdc2526794f86a81289e106dba67e0b68e|dc042342a2e5abc108af67b439ec04c86da8b61f9bdd1cf1b1e5ee0462dea7b2|ec455ee2a8bc5fc8e070575ea5bee7dce46fc6037f8c3449cbf56e8b45331fa7|e35a5066a7c77b2e79c50f315a18e042405ab7baa8a414a1a907792bb25d2adc|68baef5f20b1e41821d0e6955cbb1809262e0f3624e387e88c04f6ddb0266f2f)$''',
]
